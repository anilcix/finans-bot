<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haberler — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📰 HABERLER</h1><p>Fed · Kripto · Piyasalar · Son 72 Saat · Başlık + Tarih + Kaynak + Link</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>function dt(x){return x?new Date(x).toLocaleString('tr-TR'):'Tarih yok'}function src(){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Haber akışı</div><div class="source-value">Google News RSS araması: Fed, Bitcoin ETF ve stock market today sorguları.</div></div><div class="source-item"><div class="source-label">Zaman filtresi</div><div class="source-value">RSS pubDate alanı okunur; yalnızca son 72 saatte yayınlanan başlıklar tutulur.</div></div><div class="source-item"><div class="source-label">Gösterilen içerik</div><div class="source-value">Başlık, yayıncı, tarih ve bağlantı. Tam makale metni çekilmez.</div></div></div></div>`}async function load(){try{let d=await(await fetch('../data/news.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');content.innerHTML=(d.topics||[]).map(t=>`<div class="card"><h2>${t.label} ${tip('Bu başlık altında ilgili arama sorgusundan bulunan ve zaman filtresini geçen haberler listelenir.')}</h2>${t.error?`<div class="error-box">⚠️ ${t.error}</div>`:t.items.length?t.items.map(x=>`<div class="headline"><a href="${x.link}" target="_blank" rel="noopener">${x.title}</a><div class="source">${x.source||'Kaynak belirtilmedi'} ${tip('Haberi yayımlayan yayıncı veya medya kuruluşu.')} · ${dt(x.published_at)} ${tip('RSS kaynağındaki yayın tarihi. Panel yalnızca son 72 saatlik başlıkları tutar.')}</div></div>`).join(''):`<div class="empty">Son ${d.recency_hours||72} saatte uygun başlık bulunamadı.</div>`}</div>`).join('')+`<div class="note">Yalnızca son ${d.recency_hours||72} saatte yayınlanan başlıklar gösterilir. Tam makale metni çekilmez. ${tip('Bu panel içerik kopyalamaz; hızlı tarama için başlık, kaynak, yayın zamanı ve bağlantıyı gösterir.')}</div>`+src()}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src()}}load()</script></body></html>
