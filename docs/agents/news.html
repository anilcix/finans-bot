<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haberler — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📰 HABERLER</h1><p>Fed · Kripto · Piyasalar · Son 72 Saat · Başlık + Tarih + Kaynak + Link</p></div><div class="container" id="content"></div><script>function dt(x){return x?new Date(x).toLocaleString('tr-TR'):'Tarih yok'}async function load(){try{let d=await(await fetch('../data/news.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');content.innerHTML=(d.topics||[]).map(t=>`<div class="card"><h2>${t.label}</h2>${t.error?`<div class="error-box">⚠️ ${t.error}</div>`:t.items.length?t.items.map(x=>`<div class="headline"><a href="${x.link}" target="_blank" rel="noopener">${x.title}</a><div class="source">${x.source||'Kaynak belirtilmedi'} · ${dt(x.published_at)}</div></div>`).join(''):`<div class="empty">Son ${d.recency_hours||72} saatte uygun başlık bulunamadı.</div>`}</div>`).join('')+`<div class="note">Yalnızca son ${d.recency_hours||72} saatte yayınlanan başlıklar gösterilir. Tam makale metni çekilmez.</div>`}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`}}load()</script></body></html>
