<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gizli Baskı — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🕵️ GİZLİ BASKI</h1><p>Özel İzleme · Strategy / MSTR · Ücretli Veri Sınırları</p></div><div class="container" id="content"></div><script>async function load(){try{let d=await(await fetch('../data/hidden_pressure.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');let m=d.mstr;content.innerHTML=`<div class="card"><h2>Ücretsiz İzlenebilen Sinyal</h2><div class="stat-box"><div class="label">MSTR (Strategy)</div><div class="value">${m?'$'+m.price.toFixed(2):'—'}</div><div class="${m&&m.change_pct>=0?'positive':'negative'}">${m&&m.change_pct!=null?(m.change_pct>=0?'+':'')+m.change_pct.toFixed(2)+'%':''}</div></div></div><div class="card"><h2>Şimdilik Eklenemeyenler</h2><div class="note">${(d.unavailable||[]).join(' · ')}</div><div class="note">Güvenilir ücretsiz kaynak olmadığında veri uydurulmaz.</div></div>`}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`}}load()</script></body></html>
