<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kredi — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>💳 KREDİ</h1><p>HY / IG / CCC Spreadleri · SLOOS · Tüketici Kredi Stresi</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>function box(l,o,s='%',help=''){return o?`<div class="stat-box"><div class="label">${l}${help?tip(help):''}</div><div class="value">${o.value.toFixed(2)}${s}</div><div class="note">${o.date}</div></div>`:''}function src(){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Kredi spreadleri</div><div class="source-value">FRED: ICE BofA High Yield OAS, Investment Grade OAS ve CCC OAS.</div></div><div class="source-item"><div class="source-label">Banka koşulları</div><div class="source-value">FRED: SLOOS (Senior Loan Officer Opinion Survey).</div></div><div class="source-item"><div class="source-label">Tüketici stresi</div><div class="source-value">FRED: kredi kartı temerrüt ve charge-off serileri.</div></div></div></div>`}async function load(){try{let d=await(await fetch('../data/credit.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);content.innerHTML=`<div class="card"><h2>Kredi Spreadleri ${tip('Şirket tahvillerinin risksiz faize göre ek getirisini gösterir. Spread yükseldikçe kredi stresi artar.')}</h2><div class="stat-grid">${box('HY OAS',d.hy_oas,'%','High Yield tahvillerin risksiz faize göre ek getiri farkı. Yükselmesi risk iştahının bozulduğunu gösterir.')}${box('IG OAS',d.ig_oas,'%','Investment Grade, yani daha yüksek kredi kaliteli şirket tahvillerinin spreadi. Hızlı yükseliş stres sinyalidir.')}${box('CCC OAS',d.ccc_oas,'%','En düşük kredi kalitesindeki CCC tahvillerinin spreadi. Kredi piyasasının en hassas stres göstergelerinden biridir.')}</div><div class="note">Spreadlerin genişlemesi risk iştahının bozulduğunu gösterir.</div></div><div class="card"><h2>Banka & Tüketici Stresi</h2><div class="stat-grid">${box('SLOOS',d.sloos,'%','Bankaların kredi verme standartlarını ne kadar sıkılaştırdığını ölçen Fed anketi. Pozitif ve yükselen değerler krediye erişimin zorlaştığını gösterir.')}${box('Kredi Kartı Temerrüt',d.delinquency,'%','Ödemesi geciken kredi kartı borçlarının oranı. Yükselmesi hanehalkı finansal stresinin arttığını gösterebilir.')}${box('Charge-Off',d.charge_off,'%','Bankaların tahsil edemeyeceğine karar verip zarara yazdığı kredi oranı. Yükselmesi gerçekleşmiş kredi zararının arttığını gösterir.')}</div></div>`+src()}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src()}}load()</script></body></html>
