<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kredi — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.trend-line{font-size:10px;color:var(--muted);margin-top:5px}.chart-card canvas{width:100%;height:330px;display:block}.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 12px;font-size:10px;color:var(--muted)}.legend-key{display:flex;align-items:center;gap:6px}.legend-swatch{width:18px;height:3px;border-radius:3px;background:currentColor}.chart-note{font-size:10px;color:var(--muted);line-height:1.5;margin-top:8px}@media(max-width:640px){.chart-card canvas{height:280px}}</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>💳 KREDİ</h1><p>Spread Seviyesi · 1/3 Ay Trend · SLOOS · Tüketici Stresi</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
function box(l,o,s='%',help='',trend=null){return o?`<div class="stat-box"><div class="label">${l}${help?tip(help):''}</div><div class="value">${o.value.toFixed(2)}${s}</div><div class="note">${o.date}</div>${trend?`<div class="trend-line">1A: ${trend.change_1m==null?'—':(trend.change_1m>=0?'+':'')+trend.change_1m.toFixed(2)} · 3A: ${trend.change_3m==null?'—':(trend.change_3m>=0?'+':'')+trend.change_3m.toFixed(2)}</div>`:''}</div>`:''}
function src(){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Kredi spreadleri</div><div class="source-value">FRED: ICE BofA High Yield OAS, Investment Grade OAS ve CCC OAS.</div></div><div class="source-item"><div class="source-label">SLOOS</div><div class="source-value">DRTSCLCC: kredi kartı kredilerinde standartları sıkılaştıran ABD bankalarının net yüzdesi.</div></div><div class="source-item"><div class="source-label">Tüketici stresi</div><div class="source-value">FRED: kredi kartı temerrüt ve charge-off serileri.</div></div></div></div>`}
function drawHistory(hist){const canvas=document.getElementById('creditChart');if(!canvas||!hist)return;const all=[...(hist.hy||[]),...(hist.ig||[]),...(hist.ccc||[])];if(!all.length)return;const dpr=devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=Math.max(600,r.width*dpr);canvas.height=Math.max(280,r.height*dpr);const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const W=canvas.width/dpr,H=canvas.height/dpr,p={l:44,r:18,t:16,b:30},pw=W-p.l-p.r,ph=H-p.t-p.b,max=Math.ceil(Math.max(...all.map(x=>x.value))+1);c.clearRect(0,0,W,H);c.font='10px IBM Plex Mono';for(let i=0;i<=5;i++){const y=p.t+ph*i/5;c.strokeStyle='rgba(92,138,114,.14)';c.beginPath();c.moveTo(p.l,y);c.lineTo(W-p.r,y);c.stroke();c.fillStyle='#5c8a72';c.textAlign='right';c.fillText((max*(5-i)/5).toFixed(1),p.l-6,y+3)}function plot(a,col){if(!a||a.length<2)return;c.strokeStyle=col;c.lineWidth=2;c.beginPath();a.forEach((pt,i)=>{const x=p.l+pw*i/(a.length-1),y=p.t+ph*(1-pt.value/max);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}plot(hist.hy,'#39ff88');plot(hist.ig,'#5aa9ff');plot(hist.ccc,'#ff8b5c');const a=hist.ccc?.length?hist.ccc:hist.hy;if(a?.length){c.fillStyle='#5c8a72';c.textAlign='center';[0,.25,.5,.75,1].forEach(q=>{const i=Math.min(a.length-1,Math.round((a.length-1)*q));c.fillText((a[i].date||'').slice(0,4),p.l+pw*q,H-8)})}}
async function load(){try{let d=await(await fetch('../data/credit.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);const tr=d.spread_trends||{};content.innerHTML=`<div class="card"><h2>Kredi Spreadleri ${tip('Spread hem mevcut seviyesi hem de son 1/3 aylık yönüyle okunur. Pozitif değişim = spread genişliyor = stres artıyor.')}</h2><div class="stat-grid">${box('HY OAS',d.hy_oas,'%','High Yield tahvillerin risksiz faize göre ek getiri farkı.',tr.hy)}${box('IG OAS',d.ig_oas,'%','Investment Grade şirket tahvillerinin kredi risk primi.',tr.ig)}${box('CCC OAS',d.ccc_oas,'%','En düşük kredi kalitesindeki CCC tahvillerinin kredi risk primi.',tr.ccc)}</div></div><div class="card chart-card"><h2>HY · IG · CCC Geçmişi ${tip('Spreadlerin zaman içindeki yönünü ve CCC gibi düşük kalite tahvillerin HY/IG’den ayrışmasını görürsün.')}</h2><div class="chart-legend"><span class="legend-key" style="color:#39ff88"><i class="legend-swatch"></i>HY</span><span class="legend-key" style="color:#5aa9ff"><i class="legend-swatch"></i>IG</span><span class="legend-key" style="color:#ff8b5c"><i class="legend-swatch"></i>CCC</span></div><canvas id="creditChart"></canvas><div class="chart-note">Spread yükselmesi kredi stresinin arttığını; düşmesi kredi koşullarının rahatladığını gösterir.</div></div><div class="card"><h2>Banka & Tüketici Stresi</h2><div class="stat-grid">${box('SLOOS — Kredi Kartı Standartları',d.sloos,'%','Kredi kartı kredilerinde standartları sıkılaştıran ABD bankalarının net yüzdesi.')}${box('Kredi Kartı Temerrüt',d.delinquency,'%','Ödemesi geciken kredi kartı borçlarının oranı.')}${box('Charge-Off',d.charge_off,'%','Bankaların tahsil edemeyeceğine karar verip zarara yazdığı kredi oranı.')}</div></div>`+src();requestAnimationFrame(()=>drawHistory(d.history));window.addEventListener('resize',()=>drawHistory(d.history),{passive:true})}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src()}}load()</script></body></html>
