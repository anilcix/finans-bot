<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kredi — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.chart-card canvas{width:100%;height:320px;display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin:6px 0 12px}.sw{display:inline-block;width:16px;height:3px;border-radius:3px;margin-right:5px;vertical-align:middle}.cycle-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--green-dim);border-radius:14px;overflow:hidden;position:relative}.quad{min-height:115px;padding:14px;font-size:12px}.q-exp{background:rgba(36,145,77,.15)}.q-late{background:rgba(201,150,35,.14)}.q-rec{background:rgba(51,105,190,.15)}.q-con{background:rgba(184,50,50,.14)}.now{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:10px;color:#fff;border:2px solid #e7d3a0;border-radius:50%;width:36px;height:36px;display:grid;place-items:center}.phase-title{font-size:18px;font-weight:700;margin:10px 0;color:var(--green)}.metric-note{font-size:10px;color:var(--muted);line-height:1.5}.forward-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.forward-box{border:1px solid var(--green-dim);border-radius:12px;padding:12px}.forward-box .v{font-size:22px;font-weight:700;margin:5px 0}.small{font-size:9px;color:var(--muted)}@media(max-width:700px){.forward-grid{grid-template-columns:1fr 1fr}.chart-card canvas{height:275px}}</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>💳 KREDİ</h1><p>Spreadler · SLOOS · Temerrüt · Kredi Döngüsü · Tarihsel Test</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
const C={hy:'#39ff88',bb:'#d7b96f',ig:'#5aa9ff',ccc:'#ff5c5c',sp:'#f3f3f3',biz:'#a770ff',card:'#ff7f50',bo:'#8fd3ff',co:'#2fd6a2'};
function box(l,o,s='%',help=''){return o?`<div class="stat-box"><div class="label">${l} ${help?tip(help):''}</div><div class="value">${o.value.toFixed(2)}${s}</div><div class="note">${o.date}</div></div>`:''}
function setup(id){const cv=document.getElementById(id);if(!cv)return null;const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.max(600,r.width*d);cv.height=Math.max(260,r.height*d);const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return {cv,x,w:cv.width/d,h:cv.height/d}}
function drawLines(id,series){const o=setup(id);if(!o)return;const all=series.flatMap(s=>s.a||[]);if(!all.length)return;const mn=Math.min(...all.map(p=>p.value)),mx=Math.max(...all.map(p=>p.value)),pad={l:42,r:18,t:18,b:28},pw=o.w-pad.l-pad.r,ph=o.h-pad.t-pad.b;o.x.clearRect(0,0,o.w,o.h);for(let i=0;i<5;i++){let y=pad.t+ph*i/4;o.x.strokeStyle='rgba(92,138,114,.14)';o.x.beginPath();o.x.moveTo(pad.l,y);o.x.lineTo(o.w-pad.r,y);o.x.stroke();o.x.fillStyle='#5c8a72';o.x.font='9px monospace';o.x.textAlign='right';o.x.fillText((mx-(mx-mn)*i/4).toFixed(1),pad.l-5,y+3)}series.forEach(s=>{if(!s.a?.length)return;o.x.strokeStyle=s.c;o.x.lineWidth=s.w||2;o.x.beginPath();s.a.forEach((p,i)=>{let xx=pad.l+pw*i/(s.a.length-1),yy=pad.t+ph*(1-(p.value-mn)/(mx-mn||1));i?o.x.lineTo(xx,yy):o.x.moveTo(xx,yy)});o.x.stroke()});const a=series.find(s=>s.a?.length)?.a||[];if(a.length){o.x.fillStyle='#5c8a72';o.x.textAlign='center';[0,.25,.5,.75,1].forEach(q=>{let i=Math.min(a.length-1,Math.round((a.length-1)*q));o.x.fillText((a[i].date||'').slice(0,4),pad.l+pw*q,o.h-7)})}}
function phaseClass(p){if(!p)return'';if(p.startsWith('Expansion'))return'q-exp';if(p.startsWith('Late'))return'q-late';if(p.startsWith('Recovery'))return'q-rec';return'q-con'}
function src(){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Spreadler</div><div class="source-value">FRED ICE BofA HY, BB, IG ve CCC OAS.</div></div><div class="source-item"><div class="source-label">Banka koşulları</div><div class="source-value">Fed SLOOS: şirket kredileri ve kredi kartı standartları ayrı seriler.</div></div><div class="source-item"><div class="source-label">Temerrüt / zarar</div><div class="source-value">Federal Reserve ticari banka delinquency ve charge-off serileri.</div></div><div class="source-item"><div class="source-label">Rejim testi</div><div class="source-value">Bizim HY OAS / 200 günlük ortalama + 6 aylık yön kuralımız ve Yahoo Finance S&P 500 geçmişi.</div></div></div></div>`}
async function load(){try{const d=await(await fetch('../data/credit.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);const tr=d.spread_trends||{},cy=d.credit_cycle||{},fs=d.phase_forward_stats||{},cur=(fs.by_phase||{})[fs.current_phase]||{};let h=`<div class="card"><h2>Kredi Spreadleri ${tip('OAS yükseldikçe kredi riski/stres artar. Trendler yakın dönem yönü gösterir.')}</h2><div class="stat-grid">${box('HY OAS',d.hy_oas,'%','High Yield kredi spreadi.')}${box('BB OAS',d.bb_oas,'%','HY içindeki BB kalite segmenti.')}${box('IG OAS',d.ig_oas,'%','Investment Grade kredi spreadi.')}${box('CCC OAS',d.ccc_oas,'%','En düşük kalite segmenti; stresin erken görülebildiği alan.')}</div></div>`;
h+=`<div class="card"><h2>ABD Kredi Döngüsü — Güncel Fotoğraf</h2><div class="stat-grid">${box('Şirket SLOOS — Büyük/Orta',d.sloos_business_large,'%','Büyük ve orta ölçekli C&I kredilerinde standartları sıkılaştıran bankaların net yüzdesi.')}${box('Kredi Kartı SLOOS',d.sloos_credit_card,'%','Kredi kartı standartlarını sıkılaştıran bankaların net yüzdesi.')}${box('Kredi Kartı Temerrüt',d.credit_card_delinquency,'%','Kredi kartı delinquency oranı.')}${box('Ticari Kredi Temerrüt',d.business_delinquency,'%','Business loans delinquency oranı.')}${box('Ticari Zarar Yazma',d.business_charge_off,'%','Business loan charge-off oranı.')}${box('Tüketici Zarar Yazma',d.consumer_charge_off,'%','Consumer loan charge-off oranı.')}</div></div>`;
h+=`<div class="card chart-card"><h2>HY · BB · IG · CCC Spread Geçmişi</h2><div class="legend"><span><i class="sw" style="background:${C.hy}"></i>HY</span><span><i class="sw" style="background:${C.bb}"></i>BB</span><span><i class="sw" style="background:${C.ig}"></i>IG</span><span><i class="sw" style="background:${C.ccc}"></i>CCC</span></div><canvas id="spreadChart"></canvas></div>`;
h+=`<div class="card chart-card"><h2>Şirket SLOOS Geçmişi ${tip('Görseldeki %0,0 değerine denk gelen şirket kredisi SLOOS serisi budur; kredi kartı SLOOS ile karıştırılmaz.')}</h2><canvas id="sloosChart"></canvas></div>`;
h+=`<div class="card chart-card"><h2>Temerrüt ve Zarar Yazma Oranları</h2><div class="legend"><span><i class="sw" style="background:#ff5c5c"></i>Kredi kartı temerrüt</span><span><i class="sw" style="background:#d7b96f"></i>Ticari temerrüt</span><span><i class="sw" style="background:${C.bo}"></i>Ticari zarar</span><span><i class="sw" style="background:${C.co}"></i>Tüketici zarar</span></div><canvas id="stressChart"></canvas></div>`;
if(cy.phase){h+=`<div class="card"><h2>Kredi Döngüsü Evresi ${tip('Bizim kuralımız: HY OAS seviyesi 200 günlük ortalamaya göre + yaklaşık 6 aylık yön.')}</h2><div class="cycle-grid"><div class="quad q-exp">Expansion<br><span class="small">düşük spread + iyileşiyor</span></div><div class="quad q-late">Late Cycle<br><span class="small">düşük spread + bozuluyor</span></div><div class="quad q-rec">Recovery<br><span class="small">yüksek spread + iyileşiyor</span></div><div class="quad q-con">Contraction<br><span class="small">yüksek spread + bozuluyor</span></div><div class="now">ŞİMDİ</div></div><div class="phase-title">${cy.emoji||''} ${cy.phase}</div><div class="metric-note">HY: ${cy.hy_now?.toFixed(2)}% · 200G ort.: ${cy.hy_200dma?.toFixed(2)}% · 6A Δ: ${cy.hy_6m_change>=0?'+':''}${cy.hy_6m_change?.toFixed(2)} puan<br>${cy.desc||''}</div></div>`}
if(fs.current_phase&&Object.keys(cur).length){h+=`<div class="card"><h2>${fs.current_phase} — Tarihsel İleri Getiri ${tip('Başka sitenin rakamlarını kullanmıyoruz. Aynı kredi evresinin bizim tarihsel sınıflandırmamızdaki S&P 500 ileri getirileri.')}</h2><div class="forward-grid">${['1m','3m','6m','12m'].map(k=>{let x=cur[k];return x?`<div class="forward-box"><div class="small">${k.toUpperCase()} FORWARD · N=${x.n}</div><div class="v">${x.mean>=0?'+':''}${x.mean.toFixed(2)}%</div><div class="small">medyan ${x.median>=0?'+':''}${x.median.toFixed(2)}% · pozitif %${x.positive_pct.toFixed(0)}</div></div>`:''}).join('')}</div><div class="metric-note" style="margin-top:12px">${fs.method||''}</div></div>`}
if(fs.by_phase){h+=`<div class="card"><h2>Faz İstatistikleri — 12 Ay</h2><div class="table-wrap"><table class="warnings"><tr><th>Faz</th><th>Ort.</th><th>N</th><th>%95 Bootstrap CI</th><th>Pozitif</th></tr>${Object.entries(fs.by_phase).map(([p,v])=>{let x=v['12m'];return x?`<tr><td>${p}</td><td>${x.mean>=0?'+':''}${x.mean.toFixed(2)}%</td><td>${x.n}</td><td>${x.ci95[0].toFixed(1)} / ${x.ci95[1].toFixed(1)}</td><td>%${x.positive_pct.toFixed(0)}</td></tr>`:''}).join('')}</table></div><div class="metric-note">${d.method_note||''}</div></div>`}
content.innerHTML=h+src();requestAnimationFrame(()=>{drawLines('spreadChart',[{a:d.history?.hy,c:C.hy},{a:(d.spread_market_history||{}).bb,c:C.bb},{a:d.history?.ig,c:C.ig},{a:d.history?.ccc,c:C.ccc}]);drawLines('sloosChart',[{a:d.history?.sloos_business,c:C.biz}]);drawLines('stressChart',[{a:d.history?.credit_card_delinquency,c:'#ff5c5c'},{a:d.history?.business_delinquency,c:'#d7b96f'},{a:d.history?.business_charge_off,c:C.bo},{a:d.history?.consumer_charge_off,c:C.co}])});}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src()}}load();
</script></body></html>
