<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kredi — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>💳 KREDİ</h1><p>HY / IG / CCC Spreadleri · SLOOS · Tüketici Kredi Stresi</p></div><div class="container" id="content"></div><script>function box(l,o,s='%'){return o?`<div class="stat-box"><div class="label">${l}</div><div class="value">${o.value.toFixed(2)}${s}</div><div class="note">${o.date}</div></div>`:''}async function load(){try{let d=await(await fetch('../data/credit.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);content.innerHTML=`<div class="card"><h2>Kredi Spreadleri</h2><div class="stat-grid">${box('HY OAS',d.hy_oas)}${box('IG OAS',d.ig_oas)}${box('CCC OAS',d.ccc_oas)}</div><div class="note">Spreadlerin genişlemesi risk iştahının bozulduğunu gösterir.</div></div><div class="card"><h2>Banka & Tüketici Stresi</h2><div class="stat-grid">${box('SLOOS',d.sloos)}${box('Kredi Kartı Temerrüt',d.delinquency)}${box('Charge-Off',d.charge_off)}</div></div>`}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`}}load()</script></body></html>
