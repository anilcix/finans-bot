<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmanlayıcı — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>
.hero{border:1px solid var(--green);box-shadow:0 0 28px rgba(57,255,136,.12);background:linear-gradient(145deg,rgba(10,28,17,.96),rgba(5,10,7,.97))}.score-line{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.score{font-size:52px;font-weight:700;color:var(--green);line-height:1}.stance{font-size:20px;font-weight:700}.confidence{font-size:11px;color:var(--muted);margin-top:7px}.plain{font-size:13px;line-height:1.75;color:var(--text);margin-top:16px}.plain p+p{margin-top:8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{margin:0;padding-left:18px;color:var(--text);font-size:12px;line-height:1.65}.list li+li{margin-top:8px}.good h2{color:#39ff88}.bad h2{color:#ff8b5c}.action{font-size:19px;font-weight:700;line-height:1.45;color:#e7ffd1}.tag{display:inline-block;border:1px solid var(--green-dim);border-radius:999px;padding:5px 8px;margin:4px 4px 0 0;font-size:9px;color:var(--muted)}.component-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.component{border:1px solid var(--green-dim);border-radius:10px;padding:10px}.component .n{font-size:9px;color:var(--muted);text-transform:uppercase}.component .v{font-size:20px;font-weight:700;margin-top:4px}.quality{font-size:11px;color:var(--muted);line-height:1.6}.buyback{border-left:3px solid #d7b96f}.disclaimer{font-size:9px;color:var(--muted);line-height:1.55;border-top:1px solid rgba(57,255,136,.13);padding-top:10px;margin-top:12px}.news-hero{border-left:3px solid #5aa9ff}.news-score{font-size:34px;font-weight:800;line-height:1}.news-summary{font-size:12px;line-height:1.7;margin-top:10px}.news-list{display:grid;gap:12px;margin-top:16px}.news-item{border:1px solid rgba(90,169,255,.22);border-radius:12px;padding:14px}.news-title-label,.field-label{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#8bc4ff;font-weight:800}.news-title{display:block;color:var(--text);text-decoration:none;font-size:13px;font-weight:800;line-height:1.5;margin-top:5px}.news-title:hover{color:#8bc4ff}.news-meta{font-size:9px;color:var(--muted);margin-top:5px}.news-section{margin-top:12px;padding-top:10px;border-top:1px solid rgba(90,169,255,.12)}.news-brief{font-size:11px;line-height:1.65;color:#e8f1ec;margin-top:5px}.news-comment{font-size:10.5px;line-height:1.7;color:#cbd8d1;margin-top:5px}.market-impact{display:flex;align-items:center;gap:8px;margin-top:7px}.impact{display:inline-block;border:1px solid var(--green-dim);border-radius:999px;padding:4px 9px;font-size:9px;font-weight:800}.impact.good{color:#39ff88;border-color:rgba(57,255,136,.4)}.impact.bad{color:#ff7b6b;border-color:rgba(255,92,92,.4)}.impact.neutral{color:#ffcf5c;border-color:rgba(255,207,92,.4)}.article-details{margin-top:8px;border:1px solid rgba(90,169,255,.16);border-radius:8px;background:rgba(90,169,255,.035);overflow:hidden}.article-details summary{cursor:pointer;list-style:none;padding:9px 10px;font-size:9px;color:#8bc4ff;font-weight:800;letter-spacing:.04em}.article-details summary::-webkit-details-marker{display:none}.article-details summary:after{content:' ↓';color:var(--muted)}.article-details[open] summary:after{content:' ↑'}.article-full{padding:0 10px 11px;font-size:10px;line-height:1.7;color:#b9c9c0}.summary-missing{font-size:10px;color:var(--muted);font-style:italic}.publisher-link{display:inline-block;margin-top:7px;font-size:9px;color:#8bc4ff;text-decoration:none}.publisher-link:hover{text-decoration:underline}@media(max-width:700px){.cols{grid-template-columns:1fr}.component-grid{grid-template-columns:1fr 1fr}.score{font-size:42px}.stance{font-size:17px}}</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🧠 HARMANLAYICI</h1><p>9 Ajan · Haber Özeti · Ajan Yorumu · Piyasa Etkisi</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
const G='#39ff88',A='#ffcf5c',R='#ff5c5c';
function col(v){return v>=60?G:v>=45?A:R}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ul(a){return `<ul class="list">${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function comp(d){return Object.entries(d||{}).map(([k,v])=>`<div class="component"><div class="n">${esc(k.replaceAll('_',' '))}</div><div class="v" style="color:${col(v)}">${Number(v).toFixed(0)}</div></div>`).join('')}
function buyback(b,news){if(!b&&!news?.length)return'';let n=(news||[])[0];return `<div class="card buyback"><h2>🇺🇸 Treasury Buyback Okuması ${tip('Hazine buyback işlemi Fed QE değildir. Etki; duration arzı, dealer bilançosu, TGA ve yeniden ihraç ile birlikte okunur.')}</h2>${n?`<div class="action" style="font-size:14px">${esc(n.title)}</div>`:''}<div class="quality" style="margin-top:9px">Resmi takvim kaydı: ${b?.schedule_count??0} · Otomatik sonuç kaydı: ${b?.result_count??0}</div><div class="quality">${esc(b?.note||'Treasury buyback verisi ayrı mekanizma olarak izleniyor.')}</div>${b?.errors?.length?`<div class="quality" style="margin-top:6px">⚠️ ${esc(b.errors[0])}</div>`:''}</div>`}
function normTitle(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9$%]+/g,' ').trim()}
function buildNewsIndex(raw){const m=new Map();for(const t of (raw?.topics||[])){for(const x of (t.items||[])){m.set(normTitle(x.title),x)}}return m}
function publisherRow(x,index){return index.get(normTitle(x?.title))||null}
function fmtNewsDate(v){if(!v)return 'Tarih bilgisi yok';try{const d=new Date(v);const date=new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',day:'2-digit',month:'long',year:'numeric'}).format(d);const time=new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);return `${date} · ${time}`}catch(e){return 'Tarih bilgisi yok'}}
function fallbackSummary(x){
 const t=String(x?.title||'').toLowerCase();
 if(t.includes('jpmorgan')&&t.includes('buyback')&&(t.includes('won’t curb')||t.includes("won't curb")))return 'JPMorgan, bütçe açığı azaltılmadan daha büyük ABD Hazine geri alımlarının uzun vadeli tahvil faizlerini kalıcı biçimde düşürmeyeceğini belirtiyor.';
 if(t.includes('buyback')&&t.includes('structural concerns remain'))return 'ABD Hazine geri alımları uzun vadeli tahvil faizlerini kısa vadede düşürdü; haberde yüksek borçlanma ihtiyacı ve arz kaynaklı yapısal endişelerin sürdüğü belirtiliyor.';
 if(t.includes('bonds bounce')&&t.includes('relief may be brief'))return 'ABD Hazine geri alımları tahvil fiyatlarını destekledi ve faizleri gevşetti; haberde bu rahatlamanın kısa süreli kalabileceği belirtiliyor.';
 if(t.includes('bond yields fall')&&t.includes('treasury'))return 'ABD Hazinesi’nin sürpriz adımı sonrasında tahvil faizleri geriledi; adım yükselen uzun vadeli borçlanma maliyetlerindeki baskıyı azaltmayı hedefliyor.';
 if(t.includes('gold')&&t.includes('bitcoin')&&t.includes('surged together'))return 'Haberde altın ve Bitcoin’in aynı dönemde yükselmesi Hazine geri alımları, likidite beklentileri ve doların satın alma gücüne ilişkin tartışmalarla ilişkilendiriliyor.';
 if(t.includes('crypto prices surging')||t.includes('bitcoin reclaims'))return 'Bitcoin yeniden 68 bin dolar bölgesine yükseldi; haberde hareket artan likidite ve ETF girişleriyle ilişkilendiriliyor.';
 if(t.includes('national debt')&&t.includes('$40'))return 'ABD federal borcu 40 trilyon dolar eşiğini aştı; borç stokunun son on yılda yaklaşık iki katına çıktığı belirtiliyor.';
 if(t.includes('doubles long-term bond buybacks'))return 'ABD Hazinesi uzun vadeli tahvil geri alım miktarını artırdı; haberin ardından uzun vadeli faizler ve döviz piyasasında kısa süreli tepki görüldü.';
 return '';
}
function articleSummary(x,index){const p=publisherRow(x,index);const s=String(p?.article_summary||p?.context||'').trim();if(s&&normTitle(s)!==normTitle(x?.title))return s;return fallbackSummary(x)}
function articleContext(x,index){const p=publisherRow(x,index);const c=String(p?.article_context||'').trim();const s=articleSummary(x,index);return c&&c!==s?c:''}
function articleHref(x,index){const p=publisherRow(x,index);return p?.resolved_url||x?.link||'#'}
function articleMode(x,index){const p=publisherRow(x,index);return p?.context_mode==='publisher_article'?'yayıncı sayfası okundu':'yayıncı içeriği alınamadı'}
function agentComment(x){
 const t=String(x?.title||'').toLowerCase(); const confirm=x?.data_confirmation?` Mevcut veri teyidi: ${x.data_confirmation}`:'';
 if(t.includes('jpmorgan')&&t.includes('buyback'))return 'Bizim çerçevemizde buyback kısa vadeli likidite/duration rahatlaması sağlayabilir ama bütçe açığı ve yeni ihraç devam ederse kalıcı parasal genişleme değildir. Uzun faiz baskısının sürmesi büyüme hisseleri için risk.'+confirm;
 if(t.includes('structural concerns remain'))return 'Bu haber kısa vadeli rahatlama ile yapısal borç/arz sorununu aynı anda gösteriyor. Buyback’i QE olarak okumuyoruz; orta vadede Hazine arzı ve bütçe açığı daha belirleyici.'+confirm;
 if(t.includes('relief may be brief'))return 'İlk tepki risk varlıkları için olumlu olabilir; ancak faiz düşüşü kredi spreadleri ve finansal koşullarla teyit edilmezse bu rahatlamayı kalıcı saymıyoruz.'+confirm;
 if(t.includes('bond yields fall')&&t.includes('treasury'))return 'Uzun vadeli faizlerin gerilemesi değerlemeler ve finansal koşullar açısından destekleyici. Fakat hareketin kalıcılığı için TGA, yeni tahvil arzı ve kredi spreadleri izlenmeli.'+confirm;
 if(t.includes('gold')&&t.includes('bitcoin'))return 'Altın ve Bitcoin’in birlikte güçlenmesi likidite/debasement anlatısıyla uyumlu. Ancak Bitcoin tarafında OI ve funding hızlanıyorsa spot talep teyidi olmadan yükselişi tamamen sağlıklı kabul etmiyoruz.'+confirm;
 if(t.includes('crypto prices surging')||t.includes('bitcoin reclaims'))return 'ETF/spot talep gerçekten güçleniyorsa olumlu; fakat kaldıraç artışı CVD tarafından teyit edilmiyorsa rallinin kırılganlığı yükselir.'+confirm;
 if(t.includes('national debt')&&t.includes('$40'))return 'Yüksek borç stoku daha fazla ihraç ve term premium baskısı anlamına gelebilir. Bu nedenle uzun faizler ve dolar likiditesi açısından yapısal risk olarak izliyoruz.'+confirm;
 return (x?.market_effect||'Haberi tek başına sinyal olarak kullanmıyoruz; ilgili ajan verileriyle teyit ediyoruz.')+confirm;
}
function marketImpact(x){
 const t=String(x?.title||'').toLowerCase();
 if(t.includes('jpmorgan')&&t.includes('buyback'))return {label:'NEGATİF',cls:'bad'};
 if(t.includes('national debt')&&t.includes('$40'))return {label:'NEGATİF',cls:'bad'};
 if(t.includes('structural concerns remain')||t.includes('relief may be brief')||t.includes('gold')&&t.includes('bitcoin'))return {label:'NÖTR / KARIŞIK',cls:'neutral'};
 if(t.includes('bond yields fall')||t.includes('doubles long-term bond buybacks')||t.includes('crypto prices surging')||t.includes('bitcoin reclaims'))return {label:'POZİTİF',cls:'good'};
 const imp=String(x?.impact||'').toLowerCase();
 if(imp.includes('risk'))return {label:'NEGATİF',cls:'bad'};
 if(imp.includes('destek'))return {label:'POZİTİF',cls:'good'};
 return {label:'NÖTR / KARIŞIK',cls:'neutral'};
}
function newsBlock(n,index){if(!n)return'';
 const items=(n.important_news||[]).map(x=>{const p=publisherRow(x,index),mi=marketImpact(x),sum=articleSummary(x,index),full=articleContext(x,index),href=articleHref(x,index),mode=articleMode(x,index),published=fmtNewsDate(p?.published_at||x?.published_at);return `<div class="news-item"><div class="news-title-label">Haber başlığı</div><a class="news-title" href="${esc(href)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="news-meta">${esc(x.source||'Kaynak')} · ${esc(x.topic||'Haber')} · 🕒 ${esc(published)} · ${esc(mode)}</div><div class="news-section"><div class="field-label">Haber özeti</div>${sum?`<div class="news-brief">${esc(sum)}</div>`:`<div class="summary-missing">Yayıncı sayfası otomatik okunamadı; başlık özet diye tekrar edilmiyor.</div>`}${full?`<details class="article-details"><summary>Devamını göster</summary><div class="article-full">${esc(full)}</div></details>`:''}<a class="publisher-link" href="${esc(href)}" target="_blank" rel="noopener">Haberi yayıncıda aç ↗</a></div><div class="news-section"><div class="field-label">Ajan yorumu</div><div class="news-comment">${esc(agentComment(x))}</div></div><div class="news-section"><div class="field-label">Piyasaya etkisi</div><div class="market-impact"><span class="impact ${mi.cls}">${mi.label}</span></div></div></div>`}).join('');
 return `<div class="card news-hero"><h2>📰 Önemli Haberler — Özet + Ajan Yorumu + Etki ${tip('Haber özeti yayıncı içeriğinden çıkarılır ve yorum içermez. Uzunsa Devamını göster ile kart aşağı doğru açılır. Ajan yorumu ve piyasa etkisi ayrı katmandır.')}</h2><div class="score-line"><div class="news-score" style="color:${col(n.score)}">${Number(n.score??50).toFixed(0)}<span style="font-size:12px;color:var(--muted)">/100</span></div><div><div class="stance" style="font-size:15px">${esc(n.tone||'—')}</div><div class="confidence">${n.unique_story_count??0} benzersiz haber · yayıncı içerikleri ayrıca okunuyor</div></div></div><div class="news-summary">${esc(n.summary||'')}</div><div class="news-list">${items||'<div class="quality">Önemli haber bulunamadı.</div>'}</div></div>`}
async function load(){try{const ts=Date.now();const [d,rawNews]=await Promise.all([(await fetch('../data/harmonizer.json?t='+ts)).json(),(await fetch('../data/news.json?t='+ts)).json()]);const newsIndex=buildNewsIndex(rawNews);updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);const iv=d.investment_view||{},q=d.data_quality||{};content.innerHTML=`<div class="card hero"><h2>Bugünün Piyasa Görüşü ${tip('Nicel alt skorlar, haber akışı ve 9 ajanın teyit/çelişkileri tek merkezde birleştirilir. Veri kalitesi düşükse skor nötre doğru çekilir.')}</h2><div class="score-line"><div class="score" style="color:${col(d.market_score)}">${Number(d.market_score).toFixed(0)}<span style="font-size:16px;color:var(--muted)">/100</span></div><div><div class="stance">${esc(d.stance)}</div><div class="confidence">Model güveni: %${Number(d.confidence).toFixed(0)}</div></div></div><div class="plain">${(d.plain_summary||[]).map(x=>`<p>${esc(x)}</p>`).join('')}</div></div>
<div class="card"><h2>Ajan Skorları</h2><div class="component-grid">${comp(d.component_scores)}</div></div>
${newsBlock(d.news_analysis,newsIndex)}
<div class="cols"><div class="card good"><h2>✅ Destekleyen Sinyaller</h2>${ul(d.supportive_factors)}</div><div class="card bad"><h2>⚠️ Kırılganlıklar</h2>${ul(d.risk_factors)}</div></div>
<div class="card"><h2>🔀 Çapraz Varlık Okuması</h2>${ul(d.cross_asset_read)}</div>
${buyback(d.treasury_buyback,d.buyback_news)}
<div class="card hero"><h2>📌 Model Yatırım Görüşü ${tip('Bu bölüm kişisel portföy tavsiyesi değil; sistemin mevcut piyasa koşullarından çıkardığı genel pozisyonlama görüşüdür.')}</h2><div class="action">${esc(iv.action||'')}</div><div class="cols" style="margin-top:16px"><div><h2 style="font-size:12px">Tercih edilen yaklaşım</h2>${ul(iv.favored)}</div><div><h2 style="font-size:12px;color:#ff8b5c">Kaçınılacak davranış</h2>${ul(iv.avoid)}</div></div><div class="cols" style="margin-top:16px"><div><h2 style="font-size:12px">➕ Risk artırma teyitleri</h2>${ul(iv.add_risk_if)}</div><div><h2 style="font-size:12px;color:#ff8b5c">➖ Risk azaltma koşulları</h2>${ul(iv.reduce_risk_if)}</div></div><div class="disclaimer">${esc(iv.disclaimer||'')}</div></div>
<div class="card"><h2>Veri Kalitesi: %${q.score??'—'}</h2><div class="quality">${(q.issues||[]).map(x=>`• ${esc(x)}`).join('<br>')||'Ana veri akışlarında belirgin sorun yok.'}</div><div style="margin-top:10px">${Object.entries(d.agent_status||{}).map(([k,v])=>`<span class="tag">${esc(k)}: ${esc(v)}</span>`).join('')}</div></div>`}catch(e){content.innerHTML=`<div class="error-box">⚠️ Harmanlayıcı henüz veri üretmedi: ${esc(e.message)}<br><br>Bir sonraki GitHub Action çalışmasında otomatik oluşacak.</div>`}}load();
</script></body></html>
