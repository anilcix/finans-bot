<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmanlayıcı — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>
.hero{border:1px solid var(--green);box-shadow:0 0 28px rgba(57,255,136,.12);background:linear-gradient(145deg,rgba(10,28,17,.96),rgba(5,10,7,.97))}.score-line{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.score{font-size:52px;font-weight:700;color:var(--green);line-height:1}.stance{font-size:20px;font-weight:700}.confidence{font-size:11px;color:var(--muted);margin-top:7px}.plain{font-size:13px;line-height:1.75;color:var(--text);margin-top:16px}.plain p+p{margin-top:8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{margin:0;padding-left:18px;color:var(--text);font-size:12px;line-height:1.65}.list li+li{margin-top:8px}.good h2{color:#39ff88}.bad h2{color:#ff8b5c}.action{font-size:19px;font-weight:700;line-height:1.45;color:#e7ffd1}.tag{display:inline-block;border:1px solid var(--green-dim);border-radius:999px;padding:5px 8px;margin:4px 4px 0 0;font-size:9px;color:var(--muted)}.component-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.component{border:1px solid var(--green-dim);border-radius:10px;padding:10px}.component .n{font-size:9px;color:var(--muted);text-transform:uppercase}.component .v{font-size:20px;font-weight:700;margin-top:4px}.quality{font-size:11px;color:var(--muted);line-height:1.6}.buyback{border-left:3px solid #d7b96f}.disclaimer{font-size:9px;color:var(--muted);line-height:1.55;border-top:1px solid rgba(57,255,136,.13);padding-top:10px;margin-top:12px}.news-hero{border-left:3px solid #5aa9ff}.news-score{font-size:34px;font-weight:800;line-height:1}.news-summary{font-size:12px;line-height:1.7;margin-top:10px}.news-topics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.news-topic{border:1px solid var(--green-dim);border-radius:10px;padding:11px}.news-topic .t{font-size:11px;font-weight:800}.news-topic .digest{font-size:10px;line-height:1.55;margin-top:6px}.news-topic .confirm{font-size:9px;color:var(--muted);line-height:1.5;margin-top:7px}.news-list{display:grid;gap:9px;margin-top:14px}.news-item{border:1px solid rgba(90,169,255,.22);border-radius:10px;padding:10px 12px}.news-item a{color:var(--text);text-decoration:none;font-size:11px;font-weight:700;line-height:1.45}.news-item a:hover{color:#8bc4ff}.news-meta{font-size:9px;color:var(--muted);margin-top:4px}.news-excerpt{font-size:10px;line-height:1.55;margin-top:7px;color:#c7d5cd}.news-read{font-size:10px;line-height:1.55;margin-top:7px}.impact{display:inline-block;border:1px solid var(--green-dim);border-radius:999px;padding:2px 7px;font-size:8px;margin-right:6px}.impact.good{color:#39ff88}.impact.bad{color:#ff8b5c}.impact.neutral{color:#ffcf5c}@media(max-width:700px){.cols{grid-template-columns:1fr}.component-grid{grid-template-columns:1fr 1fr}.news-topics{grid-template-columns:1fr}.score{font-size:42px}.stance{font-size:17px}}</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🧠 HARMANLAYICI</h1><p>9 Ajan · Haber Akışı · Tek Görüş · Mekanizma + Teyit + Risk</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
const G='#39ff88',A='#ffcf5c',R='#ff5c5c';function col(v){return v>=60?G:v>=45?A:R}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function ul(a){return `<ul class="list">${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}function comp(d){return Object.entries(d||{}).map(([k,v])=>`<div class="component"><div class="n">${esc(k.replaceAll('_',' '))}</div><div class="v" style="color:${col(v)}">${Number(v).toFixed(0)}</div></div>`).join('')}function buyback(b,news){if(!b&&!news?.length)return'';let n=(news||[])[0];return `<div class="card buyback"><h2>🇺🇸 Treasury Buyback Okuması ${tip('Hazine buyback işlemi Fed QE değildir. Etki; duration arzı, dealer bilançosu, TGA ve yeniden ihraç ile birlikte okunur.')}</h2>${n?`<div class="action" style="font-size:14px">${esc(n.title)}</div>`:''}<div class="quality" style="margin-top:9px">Resmi takvim kaydı: ${b?.schedule_count??0} · Otomatik sonuç kaydı: ${b?.result_count??0}</div><div class="quality">${esc(b?.note||'Treasury buyback verisi ayrı mekanizma olarak izleniyor.')}</div>${b?.errors?.length?`<div class="quality" style="margin-top:6px">⚠️ ${esc(b.errors[0])}</div>`:''}</div>`}
function impactClass(x){return x==='Destekleyici'?'good':x==='Risk artırıcı'?'bad':'neutral'}
function newsBlock(n){if(!n)return'';let topics=(n.topic_summaries||[]).map(x=>`<div class="news-topic"><div class="t">${esc(x.topic)} · <span style="color:${x.tone==='destekleyici'?G:x.tone==='risk artırıcı'?R:A}">${esc(x.tone)}</span></div><div class="digest">${esc(x.digest)}</div><div class="confirm"><b>Yorum:</b> ${esc(x.interpretation)}<br><b>Veri teyidi:</b> ${esc(x.data_confirmation)}</div></div>`).join('');let items=(n.important_news||[]).map(x=>`<div class="news-item"><div><span class="impact ${impactClass(x.impact)}">${esc(x.impact)}</span><span class="news-meta">${esc(x.topic)} · ${esc(x.source||'Kaynak')}</span></div><a href="${esc(x.link||'#')}" target="_blank" rel="noopener">${esc(x.title)}</a>${x.excerpt?`<div class="news-excerpt">${esc(x.excerpt)}</div>`:''}<div class="news-read"><b>Harmanlayıcı:</b> ${esc(x.interpretation)}<br><b>Teyit:</b> ${esc(x.data_confirmation)}</div></div>`).join('');return `<div class="card news-hero"><h2>📰 Haber Akışı ve Harmanlayıcı Yorumu ${tip('Haberler tek başına sinyal değildir. Sistem erişebildiği haber bağlamını okur; ardından makro, kredi, volatilite, hisse ve kripto verileriyle teyit eder.')}</h2><div class="score-line"><div class="news-score" style="color:${col(n.score)}">${Number(n.score??50).toFixed(0)}<span style="font-size:12px;color:var(--muted)">/100</span></div><div><div class="stance" style="font-size:15px">${esc(n.tone||'—')}</div><div class="confidence">${n.unique_story_count??0} benzersiz başlık · ${n.article_context_count??0} haber bağlamı okundu</div></div></div><div class="news-summary">${esc(n.summary||'')}</div><div class="quality" style="margin-top:7px">${esc(n.principle||'')}</div><div class="news-topics">${topics}</div>${items?`<h2 style="font-size:12px;margin-top:18px">Önemli Haberler</h2><div class="news-list">${items}</div>`:''}</div>`}
async function load(){try{const d=await(await fetch('../data/harmonizer.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);const iv=d.investment_view||{},q=d.data_quality||{};content.innerHTML=`<div class="card hero"><h2>Bugünün Piyasa Görüşü ${tip('Nicel alt skorlar, haber akışı ve 9 ajanın teyit/çelişkileri tek merkezde birleştirilir. Veri kalitesi düşükse skor nötre doğru çekilir.')}</h2><div class="score-line"><div class="score" style="color:${col(d.market_score)}">${Number(d.market_score).toFixed(0)}<span style="font-size:16px;color:var(--muted)">/100</span></div><div><div class="stance">${esc(d.stance)}</div><div class="confidence">Model güveni: %${Number(d.confidence).toFixed(0)}</div></div></div><div class="plain">${(d.plain_summary||[]).map(x=>`<p>${esc(x)}</p>`).join('')}</div></div>
<div class="card"><h2>Ajan Skorları</h2><div class="component-grid">${comp(d.component_scores)}</div></div>
${newsBlock(d.news_analysis)}
<div class="cols"><div class="card good"><h2>✅ Destekleyen Sinyaller</h2>${ul(d.supportive_factors)}</div><div class="card bad"><h2>⚠️ Kırılganlıklar</h2>${ul(d.risk_factors)}</div></div>
<div class="card"><h2>🔀 Çapraz Varlık Okuması</h2>${ul(d.cross_asset_read)}</div>
${buyback(d.treasury_buyback,d.buyback_news)}
<div class="card hero"><h2>📌 Model Yatırım Görüşü ${tip('Bu bölüm kişisel portföy tavsiyesi değil; sistemin mevcut piyasa koşullarından çıkardığı genel pozisyonlama görüşüdür.')}</h2><div class="action">${esc(iv.action||'')}</div><div class="cols" style="margin-top:16px"><div><h2 style="font-size:12px">Tercih edilen yaklaşım</h2>${ul(iv.favored)}</div><div><h2 style="font-size:12px;color:#ff8b5c">Kaçınılacak davranış</h2>${ul(iv.avoid)}</div></div><div class="cols" style="margin-top:16px"><div><h2 style="font-size:12px">➕ Risk artırma teyitleri</h2>${ul(iv.add_risk_if)}</div><div><h2 style="font-size:12px;color:#ff8b5c">➖ Risk azaltma koşulları</h2>${ul(iv.reduce_risk_if)}</div></div><div class="disclaimer">${esc(iv.disclaimer||'')}</div></div>
<div class="card"><h2>Veri Kalitesi: %${q.score??'—'}</h2><div class="quality">${(q.issues||[]).map(x=>`• ${esc(x)}`).join('<br>')||'Ana veri akışlarında belirgin sorun yok.'}</div><div style="margin-top:10px">${Object.entries(d.agent_status||{}).map(([k,v])=>`<span class="tag">${esc(k)}: ${esc(v)}</span>`).join('')}</div></div>`}catch(e){content.innerHTML=`<div class="error-box">⚠️ Harmanlayıcı henüz veri üretmedi: ${esc(e.message)}<br><br>Bir sonraki GitHub Action çalışmasında otomatik oluşacak.</div>`}}load();
</script></body></html>
