<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmanlayıcı — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>
.hero{border:1px solid var(--green);box-shadow:0 0 28px rgba(57,255,136,.12);background:linear-gradient(145deg,rgba(10,28,17,.96),rgba(5,10,7,.97))}.score-line{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.score{font-size:52px;font-weight:700;color:var(--green);line-height:1}.stance{font-size:20px;font-weight:700}.confidence{font-size:11px;color:var(--muted);margin-top:7px}.plain{font-size:13px;line-height:1.75;color:var(--text);margin-top:16px}.plain p+ p{margin-top:8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{margin:0;padding-left:18px;color:var(--text);font-size:12px;line-height:1.65}.list li+li{margin-top:8px}.good h2{color:#39ff88}.bad h2{color:#ff8b5c}.action{font-size:19px;font-weight:700;line-height:1.45;color:#e7ffd1}.tag{display:inline-block;border:1px solid var(--green-dim);border-radius:999px;padding:5px 8px;margin:4px 4px 0 0;font-size:9px;color:var(--muted)}.component-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.component{border:1px solid var(--green-dim);border-radius:10px;padding:10px}.component .n{font-size:9px;color:var(--muted);text-transform:uppercase}.component .v{font-size:20px;font-weight:700;margin-top:4px}.quality{font-size:11px;color:var(--muted);line-height:1.6}.buyback{border-left:3px solid #d7b96f}.disclaimer{font-size:9px;color:var(--muted);line-height:1.55;border-top:1px solid rgba(57,255,136,.13);padding-top:10px;margin-top:12px}@media(max-width:700px){.cols{grid-template-columns:1fr}.component-grid{grid-template-columns:1fr 1fr}.score{font-size:42px}.stance{font-size:17px}}</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🧠 HARMANLAYICI</h1><p>9 Ajan · Tek Görüş · Mekanizma + Teyit + Risk</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
const G='#39ff88',A='#ffcf5c',R='#ff5c5c';function col(v){return v>=60?G:v>=45?A:R}function ul(a){return `<ul class="list">${(a||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`}function comp(d){return Object.entries(d||{}).map(([k,v])=>`<div class="component"><div class="n">${k.replaceAll('_',' ')}</div><div class="v" style="color:${col(v)}">${Number(v).toFixed(0)}</div></div>`).join('')}function buyback(b,news){if(!b&&!news?.length)return'';let n=(news||[])[0];return `<div class="card buyback"><h2>🇺🇸 Treasury Buyback Okuması ${tip('Hazine buyback işlemi Fed QE değildir. Etki; duration arzı, dealer bilançosu, TGA ve yeniden ihraç ile birlikte okunur.')}</h2>${n?`<div class="action" style="font-size:14px">${n.title}</div>`:''}<div class="quality" style="margin-top:9px">Resmi takvim kaydı: ${b?.schedule_count??0} · Otomatik sonuç kaydı: ${b?.result_count??0}</div><div class="quality">${b?.note||'Treasury buyback verisi ayrı mekanizma olarak izleniyor.'}</div>${b?.errors?.length?`<div class="quality" style="margin-top:6px">⚠️ ${b.errors[0]}</div>`:''}</div>`}
async function load(){try{const d=await(await fetch('../data/harmonizer.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);const iv=d.investment_view||{},q=d.data_quality||{};content.innerHTML=`<div class="card hero"><h2>Bugünün Piyasa Görüşü ${tip('Altı temel alt skor ve 9 ajanın teyit/çelişkileri tek merkezde birleştirilir. Veri kalitesi düşükse skor nötre doğru çekilir.')}</h2><div class="score-line"><div class="score" style="color:${col(d.market_score)}">${Number(d.market_score).toFixed(0)}<span style="font-size:16px;color:var(--muted)">/100</span></div><div><div class="stance">${d.stance}</div><div class="confidence">Model güveni: %${Number(d.confidence).toFixed(0)}</div></div></div><div class="plain">${(d.plain_summary||[]).map(x=>`<p>${x}</p>`).join('')}</div></div>
<div class="card"><h2>Ajan Skorları</h2><div class="component-grid">${comp(d.component_scores)}</div></div>
<div class="cols"><div class="card good"><h2>✅ Destekleyen Sinyaller</h2>${ul(d.supportive_factors)}</div><div class="card bad"><h2>⚠️ Kırılganlıklar</h2>${ul(d.risk_factors)}</div></div>
<div class="card"><h2>🔀 Çapraz Varlık Okuması</h2>${ul(d.cross_asset_read)}</div>
${buyback(d.treasury_buyback,d.buyback_news)}
<div class="card hero"><h2>📌 Model Yatırım Görüşü ${tip('Bu bölüm kişisel portföy tavsiyesi değil; sistemin mevcut piyasa koşullarından çıkardığı genel pozisyonlama görüşüdür.')}</h2><div class="action">${iv.action||''}</div><div class="cols" style="margin-top:16px"><div><h2 style="font-size:12px">Tercih edilen yaklaşım</h2>${ul(iv.favored)}</div><div><h2 style="font-size:12px;color:#ff8b5c">Kaçınılacak davranış</h2>${ul(iv.avoid)}</div></div><div class="cols" style="margin-top:16px"><div><h2 style="font-size:12px">➕ Risk artırma teyitleri</h2>${ul(iv.add_risk_if)}</div><div><h2 style="font-size:12px;color:#ff8b5c">➖ Risk azaltma koşulları</h2>${ul(iv.reduce_risk_if)}</div></div><div class="disclaimer">${iv.disclaimer||''}</div></div>
<div class="card"><h2>Veri Kalitesi: %${q.score??'—'}</h2><div class="quality">${(q.issues||[]).map(x=>`• ${x}`).join('<br>')||'Ana veri akışlarında belirgin sorun yok.'}</div><div style="margin-top:10px">${Object.entries(d.agent_status||{}).map(([k,v])=>`<span class="tag">${k}: ${v}</span>`).join('')}</div></div>`}catch(e){content.innerHTML=`<div class="error-box">⚠️ Harmanlayıcı henüz veri üretmedi: ${e.message}<br><br>Bir sonraki GitHub Action çalışmasında otomatik oluşacak.</div>`}}load();
</script></body></html>
