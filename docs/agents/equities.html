<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hisse / Emtia — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📈 HİSSE / EMTİA</h1><p>AI / Tech · Endeksler · Altın · Gümüş · Petrol</p></div><div class="container" id="content"></div><script>function table(rows){return `<div class="table-wrap"><table class="data-table"><tr><th>Varlık</th><th>Fiyat</th><th>Günlük</th></tr>${rows.map(x=>`<tr><td>${x.label}<div class="note">${x.symbol}</div></td><td>${x.price==null?'—':'$'+x.price.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td class="${x.change_pct>=0?'positive':'negative'}">${x.change_pct==null?'—':(x.change_pct>=0?'+':'')+x.change_pct.toFixed(2)+'%'}</td></tr>`).join('')}</table></div>`}async function load(){try{let d=await(await fetch('../data/equities.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');content.innerHTML=`<div class="card"><h2>AI / Tech</h2>${table(d.tech||[])}</div><div class="card"><h2>Emtia</h2>${table(d.commodities||[])}</div>`}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`}}load()</script></body></html>
