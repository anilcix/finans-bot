<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarayıcı — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.reading{min-width:240px;white-space:normal;line-height:1.45}.mini{font-size:9px;color:var(--muted)}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--green-dim);border-radius:999px;font-size:9px}.cvd-dots{display:flex;gap:5px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.dot.g{background:#39ff88;box-shadow:0 0 8px rgba(57,255,136,.35)}.dot.r{background:#ff5c5c;box-shadow:0 0 8px rgba(255,92,92,.25)}.signal-note{font-size:10px;font-weight:700;color:#dfffea}.statline{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.statpill{border:1px solid var(--green-dim);border-radius:999px;padding:5px 8px;font-size:9px;color:var(--muted)}</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🔍 TARAYICI</h1><p>Top 200 Coin · 10dk Hacim Z-Score · Spot CVD</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
function money(v){if(v==null)return'—';v=Number(v);if(Math.abs(v)>=1e9)return(v<0?'−':'')+'$'+(Math.abs(v)/1e9).toFixed(2)+'B';if(Math.abs(v)>=1e6)return(v<0?'−':'')+'$'+(Math.abs(v)/1e6).toFixed(1)+'M';if(Math.abs(v)>=1e3)return(v<0?'−':'')+'$'+(Math.abs(v)/1e3).toFixed(1)+'K';return(v<0?'−':'')+'$'+Math.abs(v).toFixed(0)}
function pct(v,d=1){return v==null?'—':`${Number(v)>=0?'+':''}${Number(v).toFixed(d)}%`}
function dots(a){return `<div class="cvd-dots">${(a||[]).map(x=>`<span class="dot ${x.green?'g':'r'}" title="${money(x.delta_usd)}"></span>`).join('')}</div>`}
function src(d){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Evren</div><div class="source-value">CoinGecko: piyasa değerine göre Top 200 coin.</div></div><div class="source-item"><div class="source-label">Spot akış</div><div class="source-value">Binance resmi public market-data-only Spot API: 5dk kline, quote volume ve taker-buy quote volume.</div></div><div class="source-item"><div class="source-label">Hacim Z-score</div><div class="source-value">İki 5dk mum birleştirilerek 10dk mum oluşturulur. Son tamamlanmış 10dk hacim, önceki 30 adet 10dk hacme göre standartlaştırılır.</div></div><div class="source-item"><div class="source-label">Spot CVD</div><div class="source-value">Taker-buy quote hacmi − taker-sell quote hacmi. Pozitif 10dk delta yeşil CVD mumu sayılır.</div></div></div></div>`}
async function load(){try{let d=await(await fetch('../data/screener.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');let rows=d.movers||[],m=d.scan_meta||{};let status=d.error?`<div class="error-box">⚠️ Tarama tamamlanamadı: ${d.error}</div>`:rows.length?`<div class="table-wrap"><table class="data-table"><tr><th>Coin ${tip('CoinGecko Top 200 evreninden sinyal koşullarını geçen coin.')}</th><th>10dk Vol Z ${tip('Son tamamlanmış 10dk quote hacminin önceki 30 adet 10dk hacme göre Z-score değeri. 2 üzeri sıra dışı hacimdir.')}</th><th>Alıcı Payı ${tip('10dk mumdaki taker-buy quote hacminin toplam quote hacme oranı.')}</th><th>10dk Hacim</th><th>10dk Fiyat</th><th>Spot Delta ${tip('10dk taker-buy quote hacmi eksi taker-sell quote hacmi.')}</th><th>Son 3 CVD ${tip('Son üç tamamlanmış 10dk CVD mumu. Yeşil = pozitif spot delta, kırmızı = negatif.')}</th><th>Not</th></tr>${rows.map(x=>`<tr><td><b>${x.symbol}</b> <span class="mini">${x.name||''}</span><div class="mini">${money(x.price)} · 24s ${pct(x.change_24h)}</div></td><td class="positive"><b>${Number(x.volume_zscore_10m).toFixed(2)}</b></td><td class="positive"><b>${Number(x.buyer_share_pct).toFixed(1)}%</b><div class="mini">Buy ${money(x.taker_buy_10m_usd)} · Sell ${money(x.taker_sell_10m_usd)}</div></td><td>${money(x.volume_10m_usd)}</td><td class="${x.price_change_10m_pct>=0?'positive':'negative'}">${pct(x.price_change_10m_pct,2)}</td><td class="${x.spot_delta_10m_usd>=0?'positive':'negative'}">${money(x.spot_delta_10m_usd)}</td><td>${dots(x.cvd_last3)}<div class="mini">30dk ${money(x.cvd_30m_delta_usd)}</div></td><td class="reading"><span class="signal-note">${x.cvd_note||'—'}</span><div class="mini" style="margin-top:5px">Yüksek alıcılı hacim sinyali</div></td></tr>`).join('')}</table></div>`:`<div class="empty">Tarama tamamlandı; şu an Z-score + alıcı baskısı kriterlerini aynı anda geçen coin yok.</div>`;content.innerHTML=`<div class="card"><h2>Aktif Spot Akış Sinyalleri ${tip('Sinyal koşulu: yüksek 10dk hacim Z-score, taker alıcı üstünlüğü ve pozitif Spot CVD delta. Otomatik alım önerisi değildir.')}</h2><div class="note">${d.rule} · ${d.window}</div><div class="statline"><span class="statpill">Top200: ${m.top200_received??'—'}</span><span class="statpill">Binance Spot eşleşen: ${m.binance_spot_matched??'—'}</span><span class="statpill">Taranan: ${m.scanned??'—'}</span><span class="statpill">Sinyal: ${m.signal_count_before_cap??rows.length}</span></div>${status}</div><div class="card"><h2>Metodoloji ${tip('Amaç, sıradan fiyat yükselişi yerine anormal spot hacim ve gerçek taker alıcı baskısını birlikte yakalamaktır.')}</h2><div class="note">Top 200 → Binance Spot USDT eşleştirme → 5dk mumları 10dk birleştirme → hacim Z-score → taker buyer payı → Spot CVD. Eşik: Z ≥ 2.0, alıcı payı ≥ %55 ve 10dk Spot CVD delta pozitif. Sinyal geldikten sonra son üç 10dk CVD mumu kontrol edilir; son 2 veya 3 mum art arda yeşilse yanında teyit notu görünür.</div></div>`+src(d)}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src(null)}}load()</script></body></html>
