<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarayıcı — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🔍 TARAYICI</h1><p>Top 200 Coin · Hacim/MCap · Open Interest Patlaması</p></div><div class="container" id="content"></div><script>async function load(){try{let d=await(await fetch('../data/screener.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');let rows=d.movers||[];content.innerHTML=`<div class="card"><h2>Aktif Sinyaller</h2><div class="note">${d.rule} · ${d.window}</div>${rows.length?`<div class="table-wrap"><table class="data-table"><tr><th>Coin</th><th>Fiyat</th><th>24s Fiyat</th><th>Hacim/MCap</th><th>OI 24s</th></tr>${rows.map(x=>`<tr><td>${x.symbol} <span class="note">${x.name}</span></td><td>$${Number(x.price).toLocaleString()}</td><td class="${x.change_24h>=0?'positive':'negative'}">${x.change_24h.toFixed(1)}%</td><td>${x.volume_mcap_ratio.toFixed(2)}</td><td class="positive">+${x.oi_change_24h.toFixed(1)}%</td></tr>`).join('')}</table></div>`:'<div class="empty">Şu an kriterleri geçen coin yok.</div>'}</div><div class="card"><h2>Metodoloji</h2><div class="note">Şimdilik 24 saatlik OI penceresi kullanılıyor. 3 günlük hafıza sonraki geliştirme.</div></div>`}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`}}load()</script></body></html>
