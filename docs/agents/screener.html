<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarayıcı — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.reading{min-width:260px;white-space:normal;line-height:1.45}.mini{font-size:9px;color:var(--muted)}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--green-dim);border-radius:999px;font-size:9px}</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🔍 TARAYICI</h1><p>Top 200 Coin · Spot Aktivite · Coinalyze Türev Teyidi</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
function money(v){if(v==null)return'—';v=Number(v);if(v>=1e9)return'$'+(v/1e9).toFixed(2)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(1)+'M';if(v>=1e3)return'$'+(v/1e3).toFixed(1)+'K';return'$'+v.toFixed(0)}
function pct(v,d=1){return v==null?'—':`${Number(v)>=0?'+':''}${Number(v).toFixed(d)}%`}
function src(d){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Spot evreni</div><div class="source-value">CoinGecko: piyasa değerine göre Top 200 coin, fiyat, 24s hacim ve market-cap.</div></div><div class="source-item"><div class="source-label">Türev tarama</div><div class="source-value">Coinalyze: desteklenen perpetual piyasalarda 24s OI değişimi; en güçlü adaylarda funding, long/short ve liquidation.</div></div><div class="source-item"><div class="source-label">Borsa seçimi</div><div class="source-value">Her coin için mümkünse Binance → Bybit → OKX → Hyperliquid → diğer desteklenen borsalar sırasıyla likit stable-margined perpetual tercih edilir.</div></div><div class="source-item"><div class="source-label">API bütçesi</div><div class="source-value">${d?.rate_limit_design||'Coinalyze ücretsiz API limiti gözetilir.'}</div></div></div></div>`}
async function load(){try{let d=await(await fetch('../data/screener.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');let rows=d.movers||[];let status=d.error?`<div class="error-box">⚠️ Tarama tamamlanamadı: ${d.error}</div>`:rows.length?`<div class="table-wrap"><table class="data-table"><tr><th>Coin ${tip('Tarama kriterlerini geçen kripto varlık.')}</th><th>Borsa</th><th>24s Fiyat</th><th>Hacim/MCap ${tip('Spot 24 saatlik işlem hacminin piyasa değerine oranı.')}</th><th>OI 24s ${tip('Coinalyze üzerinden seçilen perpetual kontratın Open Interest değişimi.')}</th><th>Funding ${tip('Perpetual funding oranı. Aşırı pozitif değer long kalabalığını, negatif değer short baskısını gösterebilir.')}</th><th>L/S ${tip('Long/short ratio. Yalnız desteklenen Coinalyze piyasalarda gösterilir.')}</th><th>24s Tasfiye ${tip('Seçilen kontratta 24 saatlik long + short liquidation toplamı; piyasa geneli değil.')}</th><th>Okuma</th></tr>${rows.map(x=>`<tr><td><b>${x.symbol}</b> <span class="mini">${x.name||''}</span><div class="mini">${money(x.price)}</div></td><td><span class="pill">${x.exchange||'—'}</span></td><td class="${x.change_24h>=0?'positive':'negative'}">${pct(x.change_24h)}</td><td>${Number(x.volume_mcap_ratio||0).toFixed(2)}</td><td class="${x.oi_change_24h>=0?'positive':'negative'}">${pct(x.oi_change_24h)}</td><td>${pct(x.funding_pct,4)}</td><td>${x.long_short_ratio==null?'—':Number(x.long_short_ratio).toFixed(2)}</td><td>${money(x.total_liquidations_usd)}<div class="mini">L ${money(x.long_liquidations_usd)} · S ${money(x.short_liquidations_usd)}</div></td><td class="reading">${x.reading||'—'}</td></tr>`).join('')}</table></div>`:`<div class="empty">Tarama çalıştı; şu an kriterleri geçen coin yok.</div>`;let m=d.scan_meta||{};content.innerHTML=`<div class="card"><h2>Aktif Sinyaller ${tip('Spot aktivite + türev OI artışını aynı anda geçen coinler. Otomatik alım önerisi değildir.')}</h2><div class="note">${d.rule} · ${d.window}</div><div class="note">OI kaynağı: ${d.oi_source||'—'} · OI kontrolü: ${d.oi_contracts_checked??'—'} · Detay zenginleştirilen: ${m.details_enriched??'—'}</div>${status}</div><div class="card"><h2>Metodoloji ${tip('Önce spot piyasada olağandışı aktivite, sonra türev piyasasında yeni kaldıraç girişi aranır. Funding/pozisyonlanma/tasfiye verisi sinyalin niteliğini anlamak için kullanılır.')}</h2><div class="note">CoinGecko Top 200 → Hacim/MCap filtresi → Coinalyze perpetual eşleştirme → 24s OI değişimi → en güçlü adaylarda funding + long/short + liquidation. Fiyat ve OI aynı yönde büyüyorsa momentum; fiyat yatayken OI sıçrıyorsa sıkışma; fiyat düşerken OI artıyorsa short birikimi ihtimali öne çıkar.</div></div>`+src(d)}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src(null)}}load()</script></body></html>
