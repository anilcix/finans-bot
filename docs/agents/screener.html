<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarayıcı — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🔍 TARAYICI</h1><p>Top 200 Coin · Hacim/MCap · Open Interest Patlaması</p></div><div class="container" id="content"></div><script>function src(d){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Coin evreni</div><div class="source-value">CoinGecko: piyasa değerine göre Top 200 coin, fiyat, hacim ve market-cap verileri.</div></div><div class="source-item"><div class="source-label">Open Interest</div><div class="source-value">${d?.oi_source||'Bybit'} V5 market API: USDT perpetual kontratların saatlik OI geçmişi.</div></div><div class="source-item"><div class="source-label">Hesaplanan</div><div class="source-value">Hacim/MCap oranı ve son 24 saatlik OI yüzde değişimi Python tarafında hesaplanır.</div></div><div class="source-item"><div class="source-label">Binance durumu</div><div class="source-value">GitHub-hosted runner Binance Futures endpointlerinde HTTP 451 aldığı için tarayıcı OI tarafında Bybit kullanıyor; yanlışlıkla “sinyal yok” göstermemesi için hata ayrı raporlanır.</div></div></div></div>`}async function load(){try{let d=await(await fetch('../data/screener.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');let rows=d.movers||[];let status=d.error?`<div class="error-box">⚠️ Tarama tamamlanamadı: ${d.error}</div>`:rows.length?`<div class="table-wrap"><table class="data-table"><tr><th>Coin</th><th>Fiyat</th><th>24s Fiyat</th><th>Hacim/MCap</th><th>OI 24s</th></tr>${rows.map(x=>`<tr><td>${x.symbol} <span class="note">${x.name}</span></td><td>$${Number(x.price).toLocaleString()}</td><td class="${x.change_24h>=0?'positive':'negative'}">${x.change_24h.toFixed(1)}%</td><td>${x.volume_mcap_ratio.toFixed(2)}</td><td class="positive">+${x.oi_change_24h.toFixed(1)}%</td></tr>`).join('')}</table></div>`:`<div class="empty">Tarama çalıştı; şu an kriterleri geçen coin yok.</div>`;content.innerHTML=`<div class="card"><h2>Aktif Sinyaller</h2><div class="note">${d.rule} · ${d.window}</div><div class="note">OI kaynağı: ${d.oi_source||'—'} · Kontrol edilen uygun kontrat: ${d.oi_contracts_checked??'—'}</div>${status}</div><div class="card"><h2>Metodoloji</h2><div class="note">CoinGecko Top 200 içinden Hacim/Piyasa Değeri eşiğini geçen coinler seçilir. Uygun USDT perpetual kontratlarda son 24 saatlik Open Interest değişimi hesaplanır. OI = Open Interest (açık vadeli işlem pozisyonlarının toplam büyüklüğü).</div></div>`+src(d)}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src(null)}}load()</script></body></html>
