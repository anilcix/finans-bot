<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kripto Türev — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.read-list{display:grid;gap:8px}.read-item{border:1px solid var(--green-dim);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5}.quality{font-size:30px;font-weight:800}.venue-table{width:100%;border-collapse:collapse;font-size:12px}.venue-table th,.venue-table td{padding:10px 8px;border-bottom:1px solid var(--green-dim);text-align:right}.venue-table th:first-child,.venue-table td:first-child{text-align:left}.venue-table .binance-row{font-weight:800}.mini-badge{display:inline-block;padding:2px 7px;border-radius:10px;border:1px solid var(--green-dim);font-size:10px}</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📐 KRİPTO TÜREV</h1><p>Deribit · Coinalyze · Binance · Kraken Futures · Hyperliquid · OKX</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
const G='#39ff88',R='#ff5c5c';function f(x,n=2){return x==null?'—':Number(x).toFixed(n)}function money(x){if(x==null)return'—';let a=Math.abs(Number(x));return '$'+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(1)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':a.toFixed(0))}function pct(x,n=4){return x==null?'—':(Number(x)>=0?'+':'')+Number(x).toFixed(n)+'%'}function stat(l,v,n='',h=''){return `<div class="stat-box"><div class="label">${l} ${h?tip(h):''}</div><div class="value">${v}</div>${n?`<div class="note">${n}</div>`:''}</div>`}function src(d){let bs=d?.binance_status,q=d?.data_quality||{},kr=d?.kraken||{},hl=d?.hyperliquid||{},okx=d?.okx||{},ca=d?.coinalyze||{};let btxt=ca.binance_available?'Binance verisi Coinalyze üzerinden aktif.':(bs?(bs.ok?'Binance Futures doğrudan aktif':`${bs.status?'HTTP '+bs.status+' · ':''}${bs.message||'erişim başarısız'}`):'—');return `<div class="card source-card"><h2>Ücretsiz Veri Yığını · Kalite ${q.grade||'—'}</h2><div class="source-list"><div class="source-item"><div class="source-label">Deribit</div><div class="source-value">Opsiyon zinciri, OI, IV, Max Pain ve kendi GEX hesabımız.</div></div><div class="source-item"><div class="source-label">Coinalyze</div><div class="source-value">Çoklu-borsa BTC perpetual OI, funding, liquidation ve long/short · <span class="source-status">${ca.configured?(ca.ok?'aktif':'key var ama veri alınamadı'):'key yok'}</span>.</div></div><div class="source-item"><div class="source-label">Binance</div><div class="source-value">${btxt}</div></div><div class="source-item"><div class="source-label">Kraken Futures Analytics</div><div class="source-value">OI yönü, CVD, liquidation, long/short, basis, funding · <span class="source-status">${kr.ok?'aktif':'erişilemedi'}</span>.</div></div><div class="source-item"><div class="source-label">Hyperliquid</div><div class="source-value">Public BTC perp OI, funding ve 24s notional hacim · <span class="source-status">${hl.ok?'aktif':'erişilemedi'}</span>.</div></div><div class="source-item"><div class="source-label">OKX</div><div class="source-value">Public OI/funding/mark-index fallback · <span class="source-status">${okx.ok?'aktif':'erişilemedi'}</span>.</div></div></div></div>`}
function coinalyzeBlock(ca){if(!ca?.configured)return `<div class="card"><h2>Coinalyze Çoklu-Borsa</h2><div class="note">API key tanımlı değil.</div></div>`;if(!ca.ok)return `<div class="card"><h2>Coinalyze Çoklu-Borsa</h2><div class="error-box">${ca.error||ca.note||'Veri alınamadı'}</div></div>`;let b=ca.binance||{};let rows=(ca.markets||[]).map(x=>`<tr class="${x.exchange==='Binance'?'binance-row':''}"><td>${x.exchange}${x.exchange==='Binance'?' <span class="mini-badge">Coinalyze</span>':''}</td><td>${money(x.open_interest_usd)}</td><td>${pct(x.open_interest_change_24h_pct,2)}</td><td>${pct(x.funding_pct,4)}</td><td>${x.long_short_ratio==null?'—':Number(x.long_short_ratio).toFixed(2)}</td><td>${money(x.total_liquidations_24h_usd)}</td></tr>`).join('');return `<div class="card"><h2>Coinalyze · Çoklu-Borsa BTC Perpetual</h2><div class="stat-grid" style="margin-bottom:16px">${stat('Aggregate OI',money(ca.aggregate_oi_usd),`${ca.market_count||0} borsa`,'Coinalyze üzerinden seçilen büyük borsalardaki temsilci BTC perpetual kontratlarının USD OI toplamı.')}${stat('Aggregate OI 24s',pct(ca.oi_change_24h_pct,2),'','Aynı seçili borsa setinin 24 saatlik toplam OI değişimi.')}${stat('OI-Ağırlıklı Funding',pct(ca.oi_weighted_funding_pct,4),'','Borsaların funding oranlarının mevcut OI büyüklüğü ile ağırlıklandırılmış ortalaması.')}${stat('24s Liquidation',money(ca.liquidations_24h?.total_usd),ca.liquidations_24h?.dominant_side?`baskın: ${ca.liquidations_24h.dominant_side}`:'','Seçili borsalardaki long + short tasfiye toplamı.')}</div>${ca.binance_available?`<div class="card" style="margin:0 0 14px"><h2>🟡 Binance · Coinalyze Üzerinden</h2><div class="stat-grid">${stat('Binance OI',money(b.open_interest_usd),pct(b.open_interest_change_24h_pct,2)+' / 24s','GitHub runner Binance API’ye doğrudan erişemese de Coinalyze’ın topladığı Binance BTC perpetual OI verisi.')}${stat('Binance Funding',pct(b.funding_pct,4),b.symbol_on_exchange||b.symbol||'','Coinalyze üzerinden Binance funding oranı.')}${stat('Binance Long/Short',b.long_short_ratio==null?'—':Number(b.long_short_ratio).toFixed(2),'','Coinalyze üzerinden Binance long/short oranı.')}${stat('Binance Liquidation 24s',money(b.total_liquidations_24h_usd),`Long ${money(b.long_liquidations_24h_usd)} · Short ${money(b.short_liquidations_24h_usd)}`,'Coinalyze üzerinden Binance BTC perpetual long ve short tasfiyeleri.')}</div></div>`:`<div class="note">Bu üretimde Coinalyze Binance BTC perpetual market döndürmedi.</div>`}<div style="overflow:auto"><table class="venue-table"><thead><tr><th>Borsa</th><th>OI</th><th>OI 24s</th><th>Funding</th><th>L/S</th><th>Liq 24s</th></tr></thead><tbody>${rows}</tbody></table></div><div class="note" style="margin-top:10px">${ca.note||''}</div></div>`}
async function load(){try{let d=await(await fetch('../data/crypto_derivatives.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);let kr=d.kraken||{},hl=d.hyperliquid||{},okx=d.okx||{},x=d.cross_venue_oi||{},q=d.data_quality||{},ca=d.coinalyze||{};let oiValue=d.oi_zscore!=null?d.oi_zscore.toFixed(2):(d.open_interest_btc!=null?Math.round(d.open_interest_btc).toLocaleString()+' BTC':'—');let oiLabel=d.oi_zscore!=null?'OI Z-Score':'Open Interest';let oiNote=d.oi_zscore_source||d.open_interest_source||'';let flow=kr.cvd_change_24h==null?'—':(kr.cvd_change_24h>0?'Alıcı baskısı':'Satıcı baskısı');let h=`<div class="stat-grid" style="margin-bottom:20px">${stat('Veri Kalitesi',q.grade||'—',`${q.ok_count||0}/${q.source_count||0} ücretsiz ana kaynak aktif`,'Bağımsız türev kaynaklarının kaçının aynı üretimde başarıyla veri döndürdüğü.')}${stat('Kraken OI 24s',kr.open_interest_change_24h_pct==null?'—':pct(kr.open_interest_change_24h_pct,2),kr.symbol||'','Kraken BTC perpetual açık pozisyonunun 24 saatlik değişimi.')}${stat('Kraken CVD 24s',flow,kr.cvd_change_24h==null?'':(kr.cvd_change_24h>=0?'+':'')+Number(kr.cvd_change_24h).toLocaleString(),'Cumulative Volume Delta; agresif alış ve satış akışının yönünü gösterir.')}${stat('Kraken Long/Short',kr.long_short_ratio==null?'—':kr.long_short_ratio.toFixed(2),'oran','Long/short oranı.')}</div>`;
h+=coinalyzeBlock(ca);
h+=`<div class="card"><h2>Doğrudan Çapraz-Borsa Kaldıraç</h2><div class="stat-grid">${stat('Kısmi OI Toplamı',x.total_btc!=null?Math.round(x.total_btc).toLocaleString()+' BTC':'—',x.venues?x.venues.map(v=>v.venue).join(' + '):'','Doğrudan API ile aynı birime güvenle normalize edebildiğimiz borsaların OI toplamı.')}${stat('Hyperliquid OI',hl.open_interest_btc!=null?Math.round(hl.open_interest_btc).toLocaleString()+' BTC':'—',hl.open_interest_usd?money(hl.open_interest_usd):'','Hyperliquid BTC perpetual açık pozisyonu.')}${stat('Hyperliquid Funding',pct(hl.funding_pct,4),hl.funding_24h_avg_pct==null?'':'24s ort. '+pct(hl.funding_24h_avg_pct,4),'Hyperliquid public API funding oranı.')}${stat('OKX Funding',pct(okx.funding_pct,4),okx.open_interest_btc==null?'':'OI '+Math.round(okx.open_interest_btc).toLocaleString()+' BTC','OKX public BTC-USDT swap funding ve OI.')}</div></div>`;
h+=`<div class="card"><h2>Mevcut Türev Göstergeleri</h2><div class="stat-grid">${stat('Fear & Greed',d.fear_greed?d.fear_greed.value:'—',d.fear_greed?.label||'','0-100 arası piyasa duyarlılığı.')}${stat('IV Rank',d.iv_rank_pct!=null?d.iv_rank_pct.toFixed(1)+'%':'—','','Deribit volatilitesinin tarihsel yüzdeliği.')}${stat(oiLabel,oiValue,oiNote,'OI seviyesinin kısa dönem geçmişine göre standart sapması.')}${stat('Spot/Perp Basis',d.spot_perp_basis_pct!=null?d.spot_perp_basis_pct.toFixed(3)+'%':'—',d.basis_source||'','Perpetual mark ile spot/index arasındaki prim/iskonto.')}</div></div>`;
if(d.max_pain)h+=`<div class="card"><h2>Deribit Opsiyon Zinciri</h2><div class="stat-grid">${stat('Max Pain','$'+d.max_pain.strike.toLocaleString(),'','Teorik max-pain fiyat bölgesi; tek başına fiyat hedefi değildir.')}${stat('Spot','$'+Math.round(d.max_pain.spot).toLocaleString(),'','Deribit index spot.')}${stat('Put/Call OI',d.max_pain.put_call_ratio.toFixed(2),'','Put OI / Call OI oranı.')}${stat('Vadeye Kalan',d.max_pain.days_left+'g','','İncelenen en yakın vade.')}</div></div>`;
if(d.gex_musd!=null)h+=`<div class="card"><h2>Net GEX</h2><div class="badge" style="color:${d.gex_musd>=0?G:R}">${d.gex_musd>=0?'+':''}$${d.gex_musd.toFixed(2)}M — ${d.gex_musd>=0?'Pozitif gamma':'Negatif gamma'}</div><div class="note">Deribit ham zincirinden Black-Scholes gamma ile tahmini hesap; dealer yön varsayımı basitleştirilmiştir.</div></div>`;
if(d.derivatives_reading?.length)h+=`<div class="card"><h2>Veri Teyitli Türev Okuması</h2><div class="read-list">${d.derivatives_reading.map(x=>`<div class="read-item">${x}</div>`).join('')}</div></div>`;content.innerHTML=h+src(d)}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src(null)}}load()</script></body></html>
