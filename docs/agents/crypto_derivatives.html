<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kripto Türev — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.read-list{display:grid;gap:8px}.read-item{border:1px solid var(--green-dim);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5}.quality{font-size:30px;font-weight:800}</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📐 KRİPTO TÜREV</h1><p>Deribit · Kraken Futures · Hyperliquid · OKX · Coinalyze-ready</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
const G='#39ff88',R='#ff5c5c';function f(x,n=2){return x==null?'—':Number(x).toFixed(n)}function stat(l,v,n='',h=''){return `<div class="stat-box"><div class="label">${l} ${h?tip(h):''}</div><div class="value">${v}</div>${n?`<div class="note">${n}</div>`:''}</div>`}function src(d){let bs=d?.binance_status,q=d?.data_quality||{},kr=d?.kraken||{},hl=d?.hyperliquid||{},okx=d?.okx||{},ca=d?.coinalyze||{};let btxt=bs?(bs.ok?'Binance Futures aktif':`${bs.status?'HTTP '+bs.status+' · ':''}${bs.message||'erişim başarısız'}`):'—';return `<div class="card source-card"><h2>Ücretsiz Veri Yığını · Kalite ${q.grade||'—'}</h2><div class="source-list"><div class="source-item"><div class="source-label">Deribit</div><div class="source-value">Opsiyon zinciri, OI, IV, Max Pain ve kendi GEX hesabımız.</div></div><div class="source-item"><div class="source-label">Kraken Futures Analytics</div><div class="source-value">OI yönü, CVD, liquidation, long/short, basis, funding · durum: <span class="source-status">${kr.ok?'aktif':'erişilemedi'}</span>.</div></div><div class="source-item"><div class="source-label">Hyperliquid</div><div class="source-value">Public BTC perp OI, funding ve 24s notional hacim · durum: <span class="source-status">${hl.ok?'aktif':'erişilemedi'}</span>.</div></div><div class="source-item"><div class="source-label">OKX</div><div class="source-value">Public OI/funding/mark-index fallback · durum: <span class="source-status">${okx.ok?'aktif':'erişilemedi'}</span>.</div></div><div class="source-item"><div class="source-label">Coinalyze</div><div class="source-value">Ücretsiz key ile çoklu-borsa OI/liquidation/long-short katmanı hazır · ${ca.configured?(ca.ok?'key aktif':'key var ama bağlantı hatalı'):'key henüz tanımlı değil'}.</div></div><div class="source-item"><div class="source-label">Binance</div><div class="source-value">${btxt}. Artık Binance başarısız olsa bile ajan Kraken + Hyperliquid + OKX ile çalışmaya devam eder.</div></div></div></div>`}
async function load(){try{let d=await(await fetch('../data/crypto_derivatives.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);let kr=d.kraken||{},hl=d.hyperliquid||{},okx=d.okx||{},x=d.cross_venue_oi||{},q=d.data_quality||{};let oiValue=d.oi_zscore!=null?d.oi_zscore.toFixed(2):(d.open_interest_btc!=null?Math.round(d.open_interest_btc).toLocaleString()+' BTC':'—');let oiLabel=d.oi_zscore!=null?'OI Z-Score':'Open Interest';let oiNote=d.oi_zscore_source||d.open_interest_source||'';let flow=kr.cvd_change_24h==null?'—':(kr.cvd_change_24h>0?'Alıcı baskısı':'Satıcı baskısı');let h=`<div class="stat-grid" style="margin-bottom:20px">${stat('Veri Kalitesi',q.grade||'—',`${q.ok_count||0}/${q.source_count||0} ücretsiz ana kaynak aktif`,'Bağımsız türev kaynaklarının kaçının aynı üretimde başarıyla veri döndürdüğü.')}${stat('Kraken OI 24s',kr.open_interest_change_24h_pct==null?'—':(kr.open_interest_change_24h_pct>=0?'+':'')+kr.open_interest_change_24h_pct.toFixed(2)+'%',kr.symbol||'','Kraken BTC perpetual açık pozisyonunun 24 saatlik değişimi. Yön analizi için kullanılır; mutlak OI çapraz-borsa toplama katılmadan önce birim normalize edilir.')}${stat('Kraken CVD 24s',flow,kr.cvd_change_24h==null?'':(kr.cvd_change_24h>=0?'+':'')+Number(kr.cvd_change_24h).toLocaleString(),'Cumulative Volume Delta; agresif alış ve satış akışının yönünü gösterir. Pozitif alıcı, negatif satıcı baskısını işaret eder.')}${stat('Kraken Long/Short',kr.long_short_ratio==null?'—':kr.long_short_ratio.toFixed(2),'oran','Long/short oranı. 1 üzeri long tarafın, 1 altı short tarafın görece daha yoğun olduğunu gösterir.')}</div>`;
h+=`<div class="card"><h2>Çapraz-Borsa Kaldıraç</h2><div class="stat-grid">${stat('Kısmi OI Toplamı',x.total_btc!=null?Math.round(x.total_btc).toLocaleString()+' BTC':'—',x.venues?x.venues.map(v=>v.venue).join(' + '):'','Aynı birime güvenle normalize edebildiğimiz borsaların OI toplamıdır. Piyasanın tamamı değildir.')}${stat('Hyperliquid OI',hl.open_interest_btc!=null?Math.round(hl.open_interest_btc).toLocaleString()+' BTC':'—',hl.open_interest_usd?('$'+(hl.open_interest_usd/1e9).toFixed(2)+'B'):'' ,'Hyperliquid BTC perpetual açık pozisyonu.')}${stat('Hyperliquid Funding',hl.funding_pct==null?'—':(hl.funding_pct>=0?'+':'')+hl.funding_pct.toFixed(4)+'%',hl.funding_24h_avg_pct==null?'':'24s ort. '+(hl.funding_24h_avg_pct>=0?'+':'')+hl.funding_24h_avg_pct.toFixed(4)+'%','Hyperliquid public API funding oranı ve son 24 saat ortalaması.')}${stat('OKX Funding',okx.funding_pct==null?'—':(okx.funding_pct>=0?'+':'')+okx.funding_pct.toFixed(4)+'%',okx.open_interest_btc==null?'':'OI '+Math.round(okx.open_interest_btc).toLocaleString()+' BTC','OKX public BTC-USDT swap funding ve OI.')}</div></div>`;
h+=`<div class="card"><h2>Mevcut Türev Göstergeleri</h2><div class="stat-grid">${stat('Fear & Greed',d.fear_greed?d.fear_greed.value:'—',d.fear_greed?.label||'','0-100 arası piyasa duyarlılığı.')}${stat('IV Rank',d.iv_rank_pct!=null?d.iv_rank_pct.toFixed(1)+'%':'—','','Deribit volatilitesinin tarihsel yüzdeliği.')}${stat(oiLabel,oiValue,oiNote,'OI seviyesinin kısa dönem geçmişine göre standart sapması; yüksek pozitif değer kaldıraç birikimini gösterebilir.')}${stat('Spot/Perp Basis',d.spot_perp_basis_pct!=null?d.spot_perp_basis_pct.toFixed(3)+'%':'—',d.basis_source||'','Perpetual mark ile spot/index arasındaki prim/iskonto.')}</div></div>`;
if(d.max_pain)h+=`<div class="card"><h2>Deribit Opsiyon Zinciri</h2><div class="stat-grid">${stat('Max Pain','$'+d.max_pain.strike.toLocaleString(),'','Teorik max-pain fiyat bölgesi; tek başına fiyat hedefi değildir.')}${stat('Spot','$'+Math.round(d.max_pain.spot).toLocaleString(),'','Deribit index spot.')}${stat('Put/Call OI',d.max_pain.put_call_ratio.toFixed(2),'','Put OI / Call OI oranı.')}${stat('Vadeye Kalan',d.max_pain.days_left+'g','','İncelenen en yakın vade.')}</div></div>`;
if(d.gex_musd!=null)h+=`<div class="card"><h2>Net GEX</h2><div class="badge" style="color:${d.gex_musd>=0?G:R}">${d.gex_musd>=0?'+':''}$${d.gex_musd.toFixed(2)}M — ${d.gex_musd>=0?'Pozitif gamma':'Negatif gamma'}</div><div class="note">Deribit ham zincirinden Black-Scholes gamma ile tahmini hesap; dealer yön varsayımı basitleştirilmiştir.</div></div>`;
if(d.derivatives_reading?.length)h+=`<div class="card"><h2>Veri Teyitli Türev Okuması</h2><div class="read-list">${d.derivatives_reading.map(x=>`<div class="read-item">${x}</div>`).join('')}</div></div>`;content.innerHTML=h+src(d)}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src(null)}}load()</script></body></html>
