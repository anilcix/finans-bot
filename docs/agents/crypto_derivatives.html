<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kripto Türev — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📐 KRİPTO TÜREV</h1><p>Deribit Opsiyon · Binance Pozisyonlama · BTC</p></div><div class="container" id="content"></div><script>const G='#39ff88',A='#ffcf5c',R='#ff5c5c';async function load(){try{let d=await(await fetch('../data/crypto_derivatives.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);let h=`<div class="stat-grid" style="margin-bottom:20px"><div class="stat-box"><div class="label">Fear & Greed</div><div class="value">${d.fear_greed?d.fear_greed.value:'—'}</div><div class="note">${d.fear_greed?.label||''}</div></div><div class="stat-box"><div class="label">IV Rank</div><div class="value">${d.iv_rank_pct!=null?d.iv_rank_pct.toFixed(1)+'%':'—'}</div></div><div class="stat-box"><div class="label">OI Z-Score</div><div class="value">${d.oi_zscore!=null?d.oi_zscore.toFixed(2):'—'}</div></div><div class="stat-box"><div class="label">Spot/Perp Basis</div><div class="value">${d.spot_perp_basis_pct!=null?d.spot_perp_basis_pct.toFixed(3)+'%':'—'}</div></div></div>`;if(d.max_pain)h+=`<div class="card"><h2>Opsiyon Zinciri — En Yakın Vade</h2><div class="stat-grid"><div class="stat-box"><div class="label">Max Pain</div><div class="value">$${d.max_pain.strike.toLocaleString()}</div></div><div class="stat-box"><div class="label">Spot</div><div class="value">$${Math.round(d.max_pain.spot).toLocaleString()}</div></div><div class="stat-box"><div class="label">Put/Call OI</div><div class="value">${d.max_pain.put_call_ratio.toFixed(2)}</div></div><div class="stat-box"><div class="label">Vadeye Kalan</div><div class="value">${d.max_pain.days_left}g</div></div></div></div>`;if(d.gex_musd!=null)h+=`<div class="card"><h2>Net GEX</h2><div class="badge" style="color:${d.gex_musd>=0?G:R}">${d.gex_musd>=0?'+':''}$${d.gex_musd.toFixed(2)}M — ${d.gex_musd>=0?'Pozitif gamma':'Negatif gamma'}</div><div class="note">Black-Scholes gamma + basitleştirilmiş dealer yön varsayımı.</div></div>`;if(d.funding)h+=`<div class="card"><h2>Funding & Carry</h2><div class="stat-grid"><div class="stat-box"><div class="label">Ort. Funding</div><div class="value">${d.funding.avg_pct.toFixed(4)}%</div></div><div class="stat-box"><div class="label">Yıllıklandırılmış</div><div class="value">${d.funding.annualized_pct.toFixed(1)}%</div></div><div class="stat-box"><div class="label">Pozitif Periyot</div><div class="value">${d.funding.positive_pct.toFixed(0)}%</div></div></div></div>`;if(d.positioning){let p=d.positioning;h+=`<div class="card"><h2>Pozisyonlama</h2><div class="stat-grid"><div class="stat-box"><div class="label">Top Trader Long</div><div class="value">${p.top_account_long.toFixed(1)}%</div></div><div class="stat-box"><div class="label">Money Long</div><div class="value">${p.top_position_long.toFixed(1)}%</div></div><div class="stat-box"><div class="label">Genel Long</div><div class="value">${p.global_long.toFixed(1)}%</div></div><div class="stat-box"><div class="label">Balina vs Retail</div><div class="value">${p.whale_retail_gap>=0?'+':''}${p.whale_retail_gap.toFixed(1)}</div></div></div></div>`}content.innerHTML=h}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`}}load()</script></body></html>
