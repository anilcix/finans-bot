<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kripto Türev — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📐 KRİPTO TÜREV</h1><p>Deribit Opsiyon · Binance / OKX / Bybit Pozisyonlama · BTC</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>const G='#39ff88',R='#ff5c5c';function src(d){let bs=d?.binance_status;let btxt=bs?(bs.ok?'Binance Futures erişimi başarılı.':`Binance denendi: ${bs.status?'HTTP '+bs.status+' · ':''}${bs.message||'erişim başarısız'}`):'Binance durum bilgisi bir sonraki veri üretiminde görünecek.';return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Fear & Greed</div><div class="source-value">Alternative.me Fear & Greed Index.</div></div><div class="source-item"><div class="source-label">Opsiyon zinciri</div><div class="source-value">Deribit public API: BTC opsiyon open interest, mark IV, vade ve strike verileri.</div></div><div class="source-item"><div class="source-label">GEX / Max Pain</div><div class="source-value">Deribit ham zincirinden Python tarafında hesaplanır; GEX hesabında Black-Scholes gamma ve basitleştirilmiş dealer yön varsayımı kullanılır.</div></div><div class="source-item"><div class="source-label">Funding</div><div class="source-value">Öncelik Binance; aktif kaynak: <span class="source-status">${d?.funding?.source||'—'}</span>. Gerekirse OKX fallback.</div></div><div class="source-item"><div class="source-label">Pozisyonlama</div><div class="source-value">Öncelik Binance top-trader long/short; aktif kaynak: <span class="source-status">${d?.positioning?.source||'—'}</span>. Gerekirse Bybit fallback.</div></div><div class="source-item"><div class="source-label">OI / Basis</div><div class="source-value">Öncelik Binance; aktif OI kaynağı <span class="source-status">${d?.open_interest_source||'—'}</span>, basis kaynağı <span class="source-status">${d?.basis_source||'—'}</span>.</div></div><div class="source-item"><div class="source-label">Binance kontrolü</div><div class="source-value">${btxt}</div></div></div></div>`}async function load(){try{let d=await(await fetch('../data/crypto_derivatives.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);let oiValue=d.oi_zscore!=null?d.oi_zscore.toFixed(2):(d.open_interest_btc!=null?Math.round(d.open_interest_btc).toLocaleString()+' BTC':'—');let oiLabel=d.oi_zscore!=null?'OI Z-Score':'Open Interest';let oiHelp=d.oi_zscore!=null?'Open Interest seviyesinin kendi geçmiş ortalamasından kaç standart sapma uzakta olduğunu gösterir. Pozitif yüksek değerler olağandışı kaldıraç birikimini gösterebilir.':'Açık kalan vadeli işlem pozisyonlarının toplam büyüklüğü. Hızlı artış kaldıraç ve tasfiye riskini artırabilir.';let h=`<div class="stat-grid" style="margin-bottom:20px"><div class="stat-box"><div class="label">Fear & Greed ${tip('0-100 arası piyasa duyarlılık endeksi. Düşük değerler korku, yüksek değerler açgözlülük bölgesini gösterir.')}</div><div class="value">${d.fear_greed?d.fear_greed.value:'—'}</div><div class="note">${d.fear_greed?.label||''}</div></div><div class="stat-box"><div class="label">IV Rank ${tip('Mevcut implied volatility seviyesinin kendi tarihsel aralığında nerede olduğunu gösterir. Yüksek IV Rank opsiyon primlerinin tarihsel olarak pahalılaştığını gösterebilir.')}</div><div class="value">${d.iv_rank_pct!=null?d.iv_rank_pct.toFixed(1)+'%':'—'}</div></div><div class="stat-box"><div class="label">${oiLabel} ${tip(oiHelp)}</div><div class="value">${oiValue}</div><div class="note">${d.open_interest_source||''}</div></div><div class="stat-box"><div class="label">Spot/Perp Basis ${tip('Perpetual kontrat fiyatının spot fiyata göre prim veya iskontosudur. Pozitif basis perp fiyatının spotun üzerinde olduğunu gösterir.')}</div><div class="value">${d.spot_perp_basis_pct!=null?d.spot_perp_basis_pct.toFixed(3)+'%':'—'}</div><div class="note">${d.basis_source||''}</div></div></div>`;if(d.max_pain)h+=`<div class="card"><h2>Opsiyon Zinciri — En Yakın Vade</h2><div class="stat-grid"><div class="stat-box"><div class="label">Max Pain ${tip('Vade sonunda en fazla opsiyonun değersiz kalacağı teorik fiyat bölgesi. Tek başına fiyat hedefi değildir.')}</div><div class="value">$${d.max_pain.strike.toLocaleString()}</div></div><div class="stat-box"><div class="label">Spot ${tip('Bitcoinin güncel spot piyasa fiyatı.')}</div><div class="value">$${Math.round(d.max_pain.spot).toLocaleString()}</div></div><div class="stat-box"><div class="label">Put/Call OI ${tip('Put açık pozisyonlarının Call açık pozisyonlarına oranı. 1 üzeri değerler put tarafının daha büyük olduğunu gösterir.')}</div><div class="value">${d.max_pain.put_call_ratio.toFixed(2)}</div></div><div class="stat-box"><div class="label">Vadeye Kalan ${tip('İncelenen opsiyon vadesinin sona ermesine kalan gün sayısı.')}</div><div class="value">${d.max_pain.days_left}g</div></div></div></div>`;if(d.gex_musd!=null)h+=`<div class="card"><h2>Net GEX ${tip('Gamma Exposure, dealerların fiyat hareketlerine karşı hedge ihtiyacını özetleyen tahmini gamma maruziyetidir. Pozitif gamma genelde oynaklığı bastırıcı, negatif gamma büyütücü olabilir.')}</h2><div class="badge" style="color:${d.gex_musd>=0?G:R}">${d.gex_musd>=0?'+':''}$${d.gex_musd.toFixed(2)}M — ${d.gex_musd>=0?'Pozitif gamma':'Negatif gamma'}</div></div>`;if(d.funding)h+=`<div class="card"><h2>Funding & Carry</h2><div class="stat-grid"><div class="stat-box"><div class="label">Ort. Funding ${tip('İncelenen funding periyotlarının ortalama fonlama oranı. Pozitif değer long tarafın short tarafa ödeme yaptığını gösterir.')}</div><div class="value">${d.funding.avg_pct.toFixed(4)}%</div></div><div class="stat-box"><div class="label">Yıllıklandırılmış ${tip('Mevcut ortalama funding oranının aynı hızla sürmesi varsayımıyla yıllık karşılığıdır. Tahmin değil, ölçeklendirilmiş gösterimdir.')}</div><div class="value">${d.funding.annualized_pct.toFixed(1)}%</div></div><div class="stat-box"><div class="label">Pozitif Periyot ${tip('İncelenen funding dönemlerinin yüzde kaçında oran pozitifti. Sürekli yüksek olması long tarafın kalabalık olabileceğini gösterebilir.')}</div><div class="value">${d.funding.positive_pct.toFixed(0)}%</div></div></div></div>`;if(d.positioning){let p=d.positioning;if(p.mode==='top_traders'){h+=`<div class="card"><h2>Pozisyonlama</h2><div class="stat-grid"><div class="stat-box"><div class="label">Top Trader Long ${tip('Borsanın top trader hesaplarının yüzde kaçının net long olduğunu gösterir.')}</div><div class="value">${p.top_account_long.toFixed(1)}%</div></div><div class="stat-box"><div class="label">Money Long ${tip('Top trader pozisyon büyüklükleri üzerinden long ağırlığını gösterir; hesap sayısından farklıdır.')}</div><div class="value">${p.top_position_long.toFixed(1)}%</div></div><div class="stat-box"><div class="label">Genel Long ${tip('Tüm piyasa hesaplarının long taraftaki oranı.')}</div><div class="value">${p.global_long.toFixed(1)}%</div></div><div class="stat-box"><div class="label">Balina vs Retail ${tip('Top trader long oranı ile piyasa geneli long oranı arasındaki fark. Pozitif değer büyük oyuncuların daha long olduğunu gösterebilir.')}</div><div class="value">${p.whale_retail_gap>=0?'+':''}${p.whale_retail_gap.toFixed(1)}</div></div></div></div>`}else{h+=`<div class="card"><h2>Pozisyonlama</h2><div class="stat-grid"><div class="stat-box"><div class="label">Long Hesap Oranı ${tip('Long pozisyona sahip hesapların toplam hesaplardaki payı.')}</div><div class="value">${p.global_long.toFixed(1)}%</div></div><div class="stat-box"><div class="label">Short Hesap Oranı ${tip('Short pozisyona sahip hesapların toplam hesaplardaki payı.')}</div><div class="value">${p.global_short.toFixed(1)}%</div></div></div></div>`}}content.innerHTML=h+src(d)}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src(null)}}load()</script></body></html>
