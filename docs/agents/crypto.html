<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kripto — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>₿ KRİPTO</h1><p>Spot · Dominance · Stablecoin Likiditesi · DeFi · Ağ Aktivitesi · BTC OI/Funding</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
function pc(x){return x==null?'':`<span class="${x>=0?'positive':'negative'}">${x>=0?'+':''}${x.toFixed(2)}%</span>`}function usd(x){return '$'+Number(x).toLocaleString(undefined,{maximumFractionDigits:2})}function num(x){return x==null?'—':Number(x).toLocaleString(undefined,{maximumFractionDigits:0})}function money(x){if(x==null)return'—';x=Number(x);if(x>=1e9)return'$'+(x/1e9).toFixed(2)+'B';if(x>=1e6)return'$'+(x/1e6).toFixed(1)+'M';return'$'+x.toLocaleString(undefined,{maximumFractionDigits:0})}function fp(x){return x==null?'—':`${x>=0?'+':''}${Number(x).toFixed(4)}%`}function stat(l,v,n='',h=''){return `<div class="stat-box"><div class="label">${l} ${h?tip(h):''}</div><div class="value">${v}</div>${n?`<div class="note">${n}</div>`:''}</div>`}
function src(d){let q=d?.data_quality||{},cm=d?.network||{},dl=d?.defi||{},ca=d?.coinalyze||{};return `<div class="card source-card"><h2>Veri Kalitesi · ${q.grade||'—'}</h2><div class="source-list"><div class="source-item"><div class="source-label">CoinGecko</div><div class="source-value">Spot fiyat, piyasa değeri, dominance ve global kripto büyüklüğü.</div></div><div class="source-item"><div class="source-label">Coin Metrics Community</div><div class="source-value">BTC/ETH aktif adres ve işlem sayısı · durum: <span class="source-status">${cm.ok?'aktif':'erişilemedi'}</span>.</div></div><div class="source-item"><div class="source-label">DefiLlama</div><div class="source-value">DeFi TVL ve stablecoin piyasa değeri · durum: <span class="source-status">${dl.ok?'aktif':'erişilemedi'}</span>.</div></div><div class="source-item"><div class="source-label">Coinalyze</div><div class="source-value">BTC perpetual OI + funding · durum: <span class="source-status">${ca.ok?'aktif':'erişilemedi'}</span>. Tüm-borsa görünümünde her desteklenen borsadan bir ana BTC perpetual kontratı kullanılır; funding OI-ağırlıklı ortalamadır.</div></div></div></div>`}
async function load(){try{let d=await(await fetch('../data/crypto.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);let g=d.global||{},cm=d.network||{},btcNet=cm.btc||{},ethNet=cm.eth||{},dl=d.defi||{},chains=dl.chains||{},ca=d.coinalyze||{},all=ca.total_all_exchanges||{},core=ca.core_exchanges||{};let stable=d.stablecoin_market_cap_usd??d.stablecoin_supply_usd;let coreShare=(all.aggregate_oi_usd&&core.aggregate_oi_usd)?core.aggregate_oi_usd/all.aggregate_oi_usd*100:null;let h=`<div class="stat-grid" style="margin-bottom:20px">${stat('BTC',d.btc?usd(d.btc.price):'—',d.btc?pc(d.btc.change_24h):'', 'Bitcoin spot fiyatı ve son 24 saat değişimi.')}${stat('ETH',d.eth?usd(d.eth.price):'—',d.eth?pc(d.eth.change_24h):'', 'Ethereum spot fiyatı ve son 24 saat değişimi.')}${stat('BTC Dominance',g.btc_dominance!=null?g.btc_dominance.toFixed(1)+'%':'—','','Bitcoin piyasa değerinin toplam kripto piyasasındaki payı.')}${stat('Veri Kalitesi',d.data_quality?.grade||'—',`${d.data_quality?.ok_count||0}/${d.data_quality?.source_count||0} ana kaynak aktif`,'Bağımsız kaynakların kaçının aynı üretimde başarıyla veri döndürdüğünü gösterir.')}</div>`;
h+=`<div class="card"><h2>Piyasa Likiditesi</h2><div class="stat-grid">${stat('TOTAL',g.total_usd?(g.total_usd/1e12).toFixed(2)+'T $':'—','','Tüm kripto piyasa değeri.')}${stat('TOTAL2',g.total2_usd?(g.total2_usd/1e12).toFixed(2)+'T $':'—','','Bitcoin hariç toplam piyasa değeri.')}${stat('TOTAL3',g.total3_usd?(g.total3_usd/1e12).toFixed(2)+'T $':'—','','Bitcoin ve Ethereum hariç piyasa değeri.')}${stat('Stablecoin Market Cap',stable?(stable/1e9).toFixed(1)+'B $':'—',`${d.stablecoin_source||'—'}${d.stablecoin_7d_change_pct!=null?' · 7g '+(d.stablecoin_7d_change_pct>=0?'+':'')+d.stablecoin_7d_change_pct.toFixed(2)+'%':''}`,'Stablecoin dolaşımdaki piyasa değerini likidite göstergesi olarak izler. CoinGecko Top-50 değeri yalnızca fallbacktir.')}</div></div>`;
h+=`<div class="card"><h2>BTC OI & Funding — Coinalyze</h2><div class="stat-grid">${stat('OI · Tüm Borsalar',money(all.aggregate_oi_usd),`${all.exchange_count??'—'} borsa`,'Her desteklenen borsadan bir ana BTC perpetual kontratının USD OI toplamı.')}${stat('Funding · Tüm Borsalar',fp(all.oi_weighted_funding_pct),'OI-ağırlıklı','Tüm-borsa BTC perpetual funding oranlarının Open Interest ile ağırlıklandırılmış ortalaması.')}${stat('OI · Binance + OKX + Bybit',money(core.aggregate_oi_usd),coreShare!=null?`Toplam OI’nin %${coreShare.toFixed(1)}’i`:'','Yalnız Binance, OKX ve Bybit ana BTC perpetual kontratlarının USD OI toplamı.')}${stat('Funding · Binance + OKX + Bybit',fp(core.oi_weighted_funding_pct),'OI-ağırlıklı','Yalnız Binance, OKX ve Bybit funding oranlarının OI ile ağırlıklandırılmış ortalaması.')}</div><div class="note" style="margin-top:10px">Tüm-borsa ve ana-3 görünümü aynı Coinalyze snapshot’ından üretilir. Bu bölüm genel kaldıraç seviyesini özetler; ayrıntılı liquidation, L/S, IV ve opsiyon katmanı Kripto Türev ajanındadır.</div></div>`;
h+=`<div class="card"><h2>On-Chain Ağ Aktivitesi</h2><div class="stat-grid">${stat('BTC Aktif Adres',num(btcNet.active_addresses),btcNet.active_addresses_7d_change_pct!=null?'7g '+(btcNet.active_addresses_7d_change_pct>=0?'+':'')+btcNet.active_addresses_7d_change_pct.toFixed(1)+'%':'','Coin Metrics günlük aktif adres sayısı.')}${stat('BTC İşlem Sayısı',num(btcNet.transactions),btcNet.transactions_7d_change_pct!=null?'7g '+(btcNet.transactions_7d_change_pct>=0?'+':'')+btcNet.transactions_7d_change_pct.toFixed(1)+'%':'','Coin Metrics günlük on-chain işlem sayısı.')}${stat('ETH Aktif Adres',num(ethNet.active_addresses),ethNet.active_addresses_7d_change_pct!=null?'7g '+(ethNet.active_addresses_7d_change_pct>=0?'+':'')+ethNet.active_addresses_7d_change_pct.toFixed(1)+'%':'','Ethereum günlük aktif adres sayısı.')}${stat('ETH İşlem Sayısı',num(ethNet.transactions),ethNet.transactions_7d_change_pct!=null?'7g '+(ethNet.transactions_7d_change_pct>=0?'+':'')+ethNet.transactions_7d_change_pct.toFixed(1)+'%':'','Ethereum günlük on-chain işlem sayısı.')}</div></div>`;
h+=`<div class="card"><h2>DeFi Aktivitesi</h2><div class="stat-grid">${stat('Toplam DeFi TVL',dl.total_tvl_usd?(dl.total_tvl_usd/1e9).toFixed(1)+'B $':'—','DefiLlama','Total Value Locked; DeFi protokollerindeki kilitli değerin kaba büyüklüğü.')}${stat('Ethereum TVL',chains.Ethereum?(chains.Ethereum/1e9).toFixed(1)+'B $':'—','','Ethereum üzerindeki DeFi TVL.')}${stat('Solana TVL',chains.Solana?(chains.Solana/1e9).toFixed(1)+'B $':'—','','Solana üzerindeki DeFi TVL.')}${stat('Base TVL',chains.Base?(chains.Base/1e9).toFixed(1)+'B $':'—','','Base üzerindeki DeFi TVL.')}</div></div>`;content.innerHTML=h+src(d)}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src(null)}}load()</script></body></html>
