<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kripto — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>₿ KRİPTO</h1><p>BTC / ETH · Dominance · Stablecoin Likiditesi · Funding · OI</p></div><div class="container" id="content"></div><script>function pc(x){return x==null?'':`<span class="${x>=0?'positive':'negative'}">${x>=0?'+':''}${x.toFixed(2)}%</span>`}function usd(x){return '$'+Number(x).toLocaleString(undefined,{maximumFractionDigits:2})}function src(d){let bs=d?.binance_status;let btxt=bs?(bs.ok?'Binance Futures erişimi başarılı.':`Binance denendi: ${bs.status?'HTTP '+bs.status+' · ':''}${bs.message||'erişim başarısız'}`):'Binance durum bilgisi bir sonraki veri üretiminde görünecek.';return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Spot / piyasa büyüklüğü</div><div class="source-value">CoinGecko: BTC, ETH, dominance, TOTAL/TOTAL2/TOTAL3 ve stablecoin piyasa değeri.</div></div><div class="source-item"><div class="source-label">Funding</div><div class="source-value">Öncelik Binance Futures; aktif kaynak: <span class="source-status">${d?.funding_source||'—'}</span>. Binance erişemezse OKX fallback.</div></div><div class="source-item"><div class="source-label">Open Interest</div><div class="source-value">Öncelik Binance Futures; aktif kaynak: <span class="source-status">${d?.open_interest_source||'—'}</span>. Binance erişemezse OKX fallback.</div></div><div class="source-item"><div class="source-label">Binance kontrolü</div><div class="source-value">${btxt}</div></div></div></div>`}async function load(){try{let d=await(await fetch('../data/crypto.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');let g=d.global||{};content.innerHTML=`<div class="stat-grid" style="margin-bottom:20px"><div class="stat-box"><div class="label">BTC</div><div class="value">${d.btc?usd(d.btc.price):'—'}</div>${d.btc?pc(d.btc.change_24h):''}</div><div class="stat-box"><div class="label">ETH</div><div class="value">${d.eth?usd(d.eth.price):'—'}</div>${d.eth?pc(d.eth.change_24h):''}</div><div class="stat-box"><div class="label">BTC Dominance</div><div class="value">${g.btc_dominance?g.btc_dominance.toFixed(1)+'%':'—'}</div></div><div class="stat-box"><div class="label">Funding${d.funding_source?' · '+d.funding_source:''}</div><div class="value">${d.funding_pct==null?'—':d.funding_pct.toFixed(4)+'%'}</div><div class="note">Perpetual kontrat fonlama oranı</div></div></div><div class="card"><h2>Piyasa Büyüklüğü</h2><div class="stat-grid"><div class="stat-box"><div class="label">TOTAL</div><div class="value">${g.total_usd?(g.total_usd/1e12).toFixed(2)+'T $':'—'}</div></div><div class="stat-box"><div class="label">TOTAL2</div><div class="value">${g.total2_usd?(g.total2_usd/1e12).toFixed(2)+'T $':'—'}</div></div><div class="stat-box"><div class="label">TOTAL3</div><div class="value">${g.total3_usd?(g.total3_usd/1e12).toFixed(2)+'T $':'—'}</div></div><div class="stat-box"><div class="label">Stablecoin Arzı</div><div class="value">${d.stablecoin_supply_usd?(d.stablecoin_supply_usd/1e9).toFixed(1)+'B $':'—'}</div></div></div></div><div class="card"><h2>Kaldıraç</h2><div class="stat-box"><div class="label">BTC Open Interest${d.open_interest_source?' · '+d.open_interest_source:''}</div><div class="value">${d.open_interest_btc?Math.round(d.open_interest_btc).toLocaleString()+' BTC':'—'}</div><div class="note">Açık vadeli işlem pozisyonlarının toplam büyüklüğü</div></div></div>`+src(d)}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src(null)}}load()</script></body></html>
