<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opsiyon — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📊 OPSİYON</h1><p>VIX · VIX9D · VIX3M · Volatilite Vade Yapısı</p></div><div class="container" id="content"></div><script>function b(k,l,d){let o=d[k];return `<div class="stat-box"><div class="label">${l}</div><div class="value">${o?o.price.toFixed(2):'—'}</div><div class="${o&&o.change_pct>=0?'negative':'positive'}">${o&&o.change_pct!=null?(o.change_pct>=0?'+':'')+o.change_pct.toFixed(2)+'%':''}</div></div>`}async function load(){try{let d=await(await fetch('../data/options.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');content.innerHTML=`<div class="card"><h2>Volatilite Eğrisi</h2><div class="stat-grid">${b('vix9d','VIX9D',d)}${b('vix','VIX',d)}${b('vix3m','VIX3M',d)}</div><div class="badge" style="margin-top:16px">${d.term_structure||'Vade yapısı hesaplanamadı'}</div><div class="note">VIX'in VIX3M'ün üzerine çıkması genellikle kısa vadeli stresin yükseldiğine işaret eder.</div></div><div class="card"><h2>Veri Sınırı</h2><div class="note">SPX GEX, Zero Gamma, Call/Put Wall ve dealer Greek verileri güvenilir ücretsiz canlı opsiyon zinciri olmadan hesaplanmıyor.</div></div>`}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`}}load()</script></body></html>
