<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makro — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.chart-card canvas{width:100%;height:360px;display:block}.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 12px;font-size:11px;color:var(--muted)}.legend-key{display:flex;align-items:center;gap:6px}.legend-swatch{width:18px;height:3px;border-radius:3px;background:currentColor}.chart-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}@media(max-width:640px){.chart-card canvas{height:300px}.chart-legend{font-size:10px;gap:10px}}</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🌡️ MAKRO</h1><p>Kompozit Skor · Kredi Döngüsü · Yield Curve · Erken Uyarılar</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>const G='#39ff88',A='#ffcf5c',R='#ff5c5c';function color(s){return s>=60?G:s>=40?A:R}function stat(s){if(!s)return A;if(s.includes('🔴'))return R;if(s.includes('🟠'))return A;return G}function mt(l){let x=(l||'').toLowerCase();if(x.includes('hy'))return 'High Yield kredi spreadi. Yükselmesi daha riskli şirket borçlarında stresin arttığını gösterir.';if(x.includes('fed'))return 'Fed politika faizinin güncel seviyesi. Yüksek faiz finansal koşulları sıkılaştırabilir.';if(x.includes('cpi'))return 'Tüketici fiyatlarının yıllık değişimi. Enflasyonun hızını gösterir.';if(x.includes('sloos'))return 'Bankaların kredi standartlarını sıkılaştırma eğilimini ölçen Fed anketi.';if(x.includes('ig'))return 'Investment Grade şirket tahvillerinin spreadi. Hızlı yükseliş kredi stresine işaret eder.';if(x.includes('işsizlik'))return 'İşsizlik oranı. Belirgin yükseliş ekonomik yavaşlamaya işaret edebilir.';if(x.includes('tips'))return 'Enflasyondan arındırılmış 10 yıllık reel faiz. Yükselmesi değerlemeler üzerinde baskı yaratabilir.';if(x.includes('gdp'))return 'Ekonominin çeyreklik yıllıklandırılmış büyüme hızı. Güçlü büyüme ekonomik aktiviteyi destekler.';if(x.includes('10y-2y'))return '10 yıllık ve 2 yıllık ABD tahvil faiz farkı. Negatif olması yield curve inversion olarak izlenir.';return 'Bu göstergenin kendi tarihsel dağılımındaki konumunu ve makro risk katkısını gösterir.'}function src(){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Makro seriler</div><div class="source-value">FRED: enflasyon, Core PCE, işgücü, Fed faizi, Hazine getirileri, TIPS reel faiz, kredi spreadleri, SLOOS ve GDP serileri.</div></div><div class="source-item"><div class="source-label">S&P 500</div><div class="source-value">Yahoo Finance ^GSPC geçmiş kapanış verisi.</div></div><div class="source-item"><div class="source-label">Hesaplanan</div><div class="source-value">Kompozit skor, tarihsel percentile, kredi döngüsü, yield-curve rejimi ve erken uyarılar Python tarafında hesaplanır.</div></div></div></div>`}
function drawMacroChart(hist){const canvas=document.getElementById('macroHistoryChart');if(!canvas||!hist)return;const pce=hist.core_pce||[],fed=hist.fed_funds||[],sp=hist.sp500||[];if(!pce.length&&!fed.length&&!sp.length)return;const dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();canvas.width=Math.max(600,rect.width*dpr);canvas.height=Math.max(300,rect.height*dpr);const c=canvas.getContext('2d');c.scale(dpr,dpr);const W=canvas.width/dpr,H=canvas.height/dpr;const pad={l:46,r:58,t:20,b:34},pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;const leftVals=[...pce,...fed].map(x=>x.value),rightVals=sp.map(x=>x.value);const lmin=0,lmax=Math.max(6,Math.ceil(Math.max(...leftVals,1)));const rmin=rightVals.length?Math.floor(Math.min(...rightVals)*.92/100)*100:0,rmax=rightVals.length?Math.ceil(Math.max(...rightVals)*1.05/100)*100:1;c.clearRect(0,0,W,H);c.font='10px IBM Plex Mono';c.lineWidth=1;for(let i=0;i<=5;i++){let y=pad.t+ph*i/5;c.strokeStyle='rgba(92,138,114,.16)';c.beginPath();c.moveTo(pad.l,y);c.lineTo(W-pad.r,y);c.stroke();c.fillStyle='#5c8a72';c.textAlign='right';c.fillText((lmax*(5-i)/5).toFixed(1),pad.l-8,y+3);if(rightVals.length){c.textAlign='left';c.fillText(Math.round(rmax-(rmax-rmin)*i/5).toLocaleString(),W-pad.r+8,y+3)}}function plot(arr,col,axis){if(arr.length<2)return;c.strokeStyle=col;c.lineWidth=2;c.beginPath();arr.forEach((pt,i)=>{let x=pad.l+pw*(i/(arr.length-1));let y=axis==='r'?pad.t+ph*(1-(pt.value-rmin)/(rmax-rmin||1)):pad.t+ph*(1-(pt.value-lmin)/(lmax-lmin||1));i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}plot(pce,'#5aa9ff','l');plot(fed,'#39ff88','l');plot(sp,'#d7b96f','r');const dates=[...(sp.length?sp:pce.length?pce:fed)];if(dates.length){c.fillStyle='#5c8a72';c.textAlign='center';[0,.25,.5,.75,1].forEach(q=>{let idx=Math.min(dates.length-1,Math.round((dates.length-1)*q)),x=pad.l+pw*q;c.fillText((dates[idx].date||'').slice(0,4),x,H-10)})}}
async function load(){try{let d=await(await fetch('../data/macro.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);let h='';if(d.composite_score!=null)h+=`<div class="card"><h2>Kompozit Piyasa Isı Skoru ${tip('Birden fazla makro ve kredi göstergesinin normalize edilip tek skorda birleştirilmiş halidir. 50 civarı nötr, uç değerler daha güçlü rejim sinyali verir.')}</h2><div class="big-score"><div class="num" style="color:${color(d.composite_score)}">${Math.round(d.composite_score)}<span style="font-size:20px;color:var(--muted)">/100</span></div><div class="label">${d.composite_emoji||''} ${d.composite_label||''}</div></div></div>`;if(d.barometer?.length){h+=`<div class="card"><h2>Piyasa Barometresi ${tip('Her göstergenin kendi geçmişine göre hangi yüzdelik dilimde olduğunu gösterir. Percentile, verinin yüzde değeri değildir.')}</h2><div class="sub">Tarihsel percentile</div>`;d.barometer.forEach(m=>{let sc=m.invert?100-m.percentile:m.percentile;h+=`<div class="gauge-row"><div class="meta"><span>${m.label} ${tip(mt(m.label))}</span><span class="val">${m.value.toFixed(2)} · %${m.percentile.toFixed(0)}</span></div><div class="gauge-track"><div class="gauge-fill" style="width:${m.percentile}%;background:${color(sc)}"></div></div></div>`});h+='</div>'}if(d.macro_market_history){h+=`<div class="card chart-card"><h2>Core PCE · Fed Faizi · S&P 500 ${tip('Enflasyon, para politikası ve hisse piyasasının yaklaşık son 5 yıldaki birlikte hareketini gösterir. Sol eksen yüzde, sağ eksen S&P 500 seviyesidir.')}</h2><div class="chart-legend"><span class="legend-key" style="color:#5aa9ff"><i class="legend-swatch"></i>Core PCE YoY</span><span class="legend-key" style="color:#39ff88"><i class="legend-swatch"></i>Fed Politika Faizi</span><span class="legend-key" style="color:#d7b96f"><i class="legend-swatch"></i>S&P 500</span></div><canvas id="macroHistoryChart"></canvas><div class="chart-note">Bu grafik korelasyonun yönünü görselleştirir; tek başına nedensellik göstermez. Core PCE ve Fed faizi FRED, S&P 500 Yahoo Finance verisidir.</div></div>`}h+=`<div class="stat-grid" style="margin-bottom:20px">${d.credit_cycle?.phase?`<div class="card"><h2>Kredi Döngüsü ${tip('Kredi spreadleri ve banka koşullarına göre ekonominin kredi genişlemesi veya daralması evresini özetler.')}</h2><div class="badge">${d.credit_cycle.emoji} ${d.credit_cycle.phase}</div><div class="desc">${d.credit_cycle.desc||''}</div></div>`:''}${d.yield_curve?.regime?`<div class="card"><h2>Yield Curve ${tip('Uzun ve kısa vadeli tahvil faizlerinin ilişkisini gösterir. Eğrinin tersine dönmesi geçmişte resesyon riskiyle yakından izlenmiştir.')}</h2><div class="badge">${d.yield_curve.emoji} ${d.yield_curve.regime} (${d.yield_curve.spread>=0?'+':''}${d.yield_curve.spread.toFixed(2)})</div><div class="desc">${d.yield_curve.desc||''}</div></div>`:''}</div>`;if(d.early_warnings?.length)h+=`<div class="card"><h2>Erken Uyarı Sinyalleri ${tip('Tek tek stres göstergelerinin belirlenmiş uyarı ve kriz eşiklerine ne kadar yaklaştığını gösterir. Tek kırmızı sinyal tek başına genel piyasanın krizde olduğu anlamına gelmez.')}</h2><div class="table-wrap"><table class="warnings"><tr><th>Sinyal</th><th>Değer</th><th>Uyarı ${tip('Bu seviyeden itibaren gösterge dikkat gerektiren bölgeye girer.')}</th><th>Kriz ${tip('Modelde daha aşırı stres seviyesi için kullanılan eşiktir.')}</th><th>Durum</th></tr>${d.early_warnings.map(w=>`<tr><td>${w.name}</td><td>${w.value}</td><td>${w.warn}</td><td>${w.crisis}</td><td style="color:${stat(w.status)}">${w.status}</td></tr>`).join('')}</table></div></div>`;content.innerHTML=(h||'<div class="empty">Veri yok.</div>')+src();requestAnimationFrame(()=>drawMacroChart(d.macro_market_history));window.addEventListener('resize',()=>drawMacroChart(d.macro_market_history),{passive:true})}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src()}}load()</script></body></html>
