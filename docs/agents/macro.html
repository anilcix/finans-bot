<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makro — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>
.risk-row{margin:15px 0 18px}.risk-head{display:grid;grid-template-columns:minmax(190px,1.4fr) minmax(180px,1fr) auto;gap:12px;align-items:center;font-size:12px}.risk-name{font-weight:600}.risk-val{color:var(--text);white-space:nowrap}.risk-meta{color:var(--muted);font-size:10px;margin-top:5px}.risk-band{height:12px;border-radius:999px;background:linear-gradient(90deg,#7a1f2a 0%,#c86d26 30%,#d5bd45 50%,#56b86b 72%,#1b8f58 100%);position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.risk-marker{position:absolute;top:-5px;width:3px;height:22px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(255,255,255,.65);transform:translateX(-50%)}.trend{display:inline-flex;gap:5px;flex-wrap:wrap}.trend-chip{border:1px solid var(--green-dim);border-radius:999px;padding:3px 6px;font-size:9px;color:var(--muted)}.signal{font-size:10px;margin-top:5px}.chart-card canvas{width:100%;height:340px;display:block}.chart-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.chart-btn{background:#08100b;border:1px solid var(--green-dim);color:var(--muted);border-radius:8px;padding:7px 10px;font:inherit;font-size:10px;cursor:pointer}.chart-btn.active{border-color:var(--green);color:var(--green);background:rgba(57,255,136,.06)}.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 12px;font-size:10px;color:var(--muted)}.legend-key{display:flex;align-items:center;gap:6px}.legend-swatch{width:18px;height:3px;border-radius:3px;background:currentColor}.chart-note{font-size:10px;color:var(--muted);line-height:1.55;margin-top:9px}.method-note{font-size:10px;color:var(--muted);text-align:center;margin-top:8px}.method-note b{color:var(--text)}
@media(max-width:640px){.risk-head{grid-template-columns:1fr;gap:7px}.chart-card canvas{height:285px}.risk-row{margin-bottom:20px}}
</style></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🌡️ MAKRO</h1><p>Tarihsel Seviye · Momentum · Piyasa Karşılaştırması · Erken Uyarı</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
const G='#39ff88',A='#ffcf5c',R='#ff5c5c',M='#5c8a72';let ACTIVE_ASSET='SPY',DATA=null;
function color(s){return s>=60?G:s>=40?A:R}function fmtChange(v){return v==null?'—':`${v>=0?'+':''}${v.toFixed(2)}`}
function mt(l){let x=(l||'').toLowerCase();if(x.includes('hy'))return 'High Yield kredi spreadi. Yükselmesi daha riskli şirket borçlarında stresin arttığını gösterir.';if(x.includes('ig'))return 'Investment Grade şirket tahvillerinin spreadi. Hızlı yükseliş geniş tabanlı kredi stresine işaret edebilir.';if(x.includes('sloos'))return 'Bu seri özellikle kredi kartı kredilerinde standartları sıkılaştıran ABD bankalarının net yüzdesidir.';if(x.includes('cleveland'))return 'Cleveland Fed modelinin 1 yıllık beklenen reel faiz tahmini.';if(x.includes('tips'))return '10 yıllık TIPS getirisinden gözlenen piyasa reel faizi.';if(x.includes('gdpnow'))return 'Atlanta Fed GDPNow modeli: içinde bulunulan çeyrek için gerçek zamanlı GDP büyüme tahmini.';if(x.includes('gerçekleşmiş'))return 'BEA tarafından açıklanan gerçekleşmiş reel GDP çeyreklik yıllıklandırılmış büyüme oranı.';if(x.includes('fed'))return 'Fed Funds politika faizinin seviyesi.';if(x.includes('cpi'))return 'CPI yıllık enflasyon oranı.';if(x.includes('işsizlik'))return 'ABD işsizlik oranı.';if(x.includes('10y-2y'))return '10 yıllık ve 2 yıllık ABD Hazine faizi farkı.';return 'Tarihsel konum ve yakın dönem momentum birlikte değerlendirilir.'}
function src(){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">FRED</div><div class="source-value">CPI, Fed Funds, Cleveland Fed 1Y reel faiz, 10Y TIPS, GDPNow, gerçekleşmiş GDP, SLOOS, kredi spreadleri ve Hazine faizleri.</div></div><div class="source-item"><div class="source-label">Yahoo Finance</div><div class="source-value">S&P 500, SPY, QQQ ve BTC geçmiş fiyatları.</div></div><div class="source-item"><div class="source-label">Model</div><div class="source-value">Her metrikte %65 tarihsel seviye + %35 yakın dönem momentum. Momentum mümkün olan serilerde yaklaşık 1 ve 3 aylık yönü kullanır.</div></div></div></div>`}
function setupCanvas(id){const canvas=document.getElementById(id);if(!canvas)return null;const dpr=window.devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=Math.max(600,r.width*dpr);canvas.height=Math.max(280,r.height*dpr);const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return {canvas,c,W:canvas.width/dpr,H:canvas.height/dpr}}
function axes(o,leftMin,leftMax,rightMin,rightMax){const {c,W,H}=o,p={l:46,r:55,t:18,b:30},pw=W-p.l-p.r,ph=H-p.t-p.b;c.clearRect(0,0,W,H);c.font='10px IBM Plex Mono';for(let i=0;i<=5;i++){const y=p.t+ph*i/5;c.strokeStyle='rgba(92,138,114,.14)';c.beginPath();c.moveTo(p.l,y);c.lineTo(W-p.r,y);c.stroke();c.fillStyle=M;c.textAlign='right';c.fillText((leftMax-(leftMax-leftMin)*i/5).toFixed(leftMax<=10?1:0),p.l-7,y+3);if(rightMax!=null){c.textAlign='left';c.fillText((rightMax-(rightMax-rightMin)*i/5).toFixed(0),W-p.r+7,y+3)}}return {...p,pw,ph}}
function plot(o,p,arr,col,min,max,width=2){if(!arr||arr.length<2)return;const {c}=o;c.strokeStyle=col;c.lineWidth=width;c.beginPath();arr.forEach((pt,i)=>{const x=p.l+p.pw*i/(arr.length-1),y=p.t+p.ph*(1-(pt.value-min)/(max-min||1));i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}
function xlabels(o,p,arr){if(!arr?.length)return;const {c,H}=o;c.fillStyle=M;c.textAlign='center';[0,.25,.5,.75,1].forEach(q=>{const i=Math.min(arr.length-1,Math.round((arr.length-1)*q));c.fillText((arr[i].date||'').slice(0,4),p.l+p.pw*q,H-8)})}
function drawMacroChart(hist){const o=setupCanvas('macroHistoryChart');if(!o||!hist)return;const pce=hist.core_pce||[],fed=hist.fed_funds||[],sp=hist.sp500||[],lv=[...pce,...fed].map(x=>x.value),rv=sp.map(x=>x.value);if(!lv.length)return;const lmax=Math.max(6,Math.ceil(Math.max(...lv))),rmin=rv.length?Math.floor(Math.min(...rv)*.95/100)*100:0,rmax=rv.length?Math.ceil(Math.max(...rv)*1.04/100)*100:1,p=axes(o,0,lmax,rmin,rmax);plot(o,p,pce,'#5aa9ff',0,lmax);plot(o,p,fed,G,0,lmax);if(sp.length){const scaled=sp.map(x=>({...x,value:(x.value-rmin)/(rmax-rmin||1)*lmax}));plot(o,p,scaled,'#d7b96f',0,lmax,2.3)}xlabels(o,p,sp.length?sp:pce)}
function drawScoreChart(){if(!DATA)return;const score=DATA.score_history||[],asset=(DATA.asset_history||{})[ACTIVE_ASSET]||[],o=setupCanvas('scoreHistoryChart');if(!o||!score.length)return;const p=axes(o,0,100,80,180);o.c.fillStyle='rgba(122,31,42,.18)';o.c.fillRect(p.l,p.t+p.ph*.6,p.pw,p.ph*.4);o.c.fillStyle='rgba(213,189,69,.10)';o.c.fillRect(p.l,p.t+p.ph*.4,p.pw,p.ph*.2);o.c.fillStyle='rgba(27,143,88,.10)';o.c.fillRect(p.l,p.t,p.pw,p.ph*.4);plot(o,p,score,'#e7d3a0',0,100,2.5);if(asset.length){const amin=Math.min(...asset.map(x=>x.value)),amax=Math.max(...asset.map(x=>x.value));const normalized=asset.map(x=>({...x,value:20+80*(x.value-amin)/(amax-amin||1)}));plot(o,p,normalized,'#5aa9ff',0,100,1.8)}xlabels(o,p,score)}
function drawCreditChart(hist){const o=setupCanvas('creditHistoryChart');if(!o||!hist)return;const hy=hist.hy||[],ig=hist.ig||[],ccc=hist.ccc||[],vals=[...hy,...ig,...ccc].map(x=>x.value);if(!vals.length)return;const max=Math.ceil(Math.max(...vals)+1),p=axes(o,0,max,null,null);plot(o,p,hy,G,0,max);plot(o,p,ig,'#5aa9ff',0,max);plot(o,p,ccc,'#ff8b5c',0,max);xlabels(o,p,ccc.length?ccc:hy)}
async function load(){try{const d=await(await fetch('../data/macro.json?t='+Date.now())).json();DATA=d;updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);let h='';if(d.composite_score!=null){const lw=Math.round((d.score_method?.level_weight??.65)*100),mw=Math.round((d.score_method?.momentum_weight??.35)*100);h+=`<div class="card"><h2>Kompozit Piyasa Isı Skoru ${tip('Skor artık yalnız bugünkü seviyeyi değil yakın dönem yönünü de içerir.')}</h2><div class="big-score"><div class="num" style="color:${color(d.composite_score)}">${Math.round(d.composite_score)}<span style="font-size:20px;color:var(--muted)">/100</span></div><div class="label">${d.composite_emoji||''} ${d.composite_label||''}</div></div><div class="method-note"><b>%${lw} tarihsel seviye</b> + <b>%${mw} momentum/trend</b></div></div>`}
if(d.barometer?.length){h+=`<div class="card"><h2>Piyasa Barometresi ${tip('Renk bandındaki beyaz çizgi, her metriğin tarihsel seviye ve momentumdan oluşan birleşik risk-on puanını gösterir.')}</h2><div class="sub">Sol taraf daha savunmacı/risk-off · sağ taraf daha risk-on</div>`;d.barometer.forEach(m=>{const s=m.combined_score??(m.invert?100-m.percentile:m.percentile);h+=`<div class="risk-row"><div class="risk-head"><div><div class="risk-name">${m.label} ${tip(mt(m.label))}</div><div class="risk-meta">Tarihsel yüzdelik: %${m.percentile.toFixed(0)}</div></div><div><div class="risk-band"><i class="risk-marker" style="left:${Math.max(1,Math.min(99,s))}%"></i></div><div class="signal" style="color:${color(s)}">${m.signal_emoji||''} ${m.signal_label||''} · birleşik ${s.toFixed(0)}/100</div></div><div><div class="risk-val">${m.value.toFixed(2)}</div><div class="trend"><span class="trend-chip">1A ${fmtChange(m.change_1m)}</span><span class="trend-chip">3A ${fmtChange(m.change_3m)}</span></div></div></div></div>`});h+='</div>'}
if(d.score_history?.length){h+=`<div class="card chart-card"><h2>Kompozit Skor Geçmişi + Varlık ${tip('Puanın geçmişteki hareketini seçilen varlıkla aynı zaman çizgisinde gösterir. Bu grafik model kalitesini gözle incelemek içindir.')}</h2><div class="chart-toolbar">${['SPY','QQQ','BTC'].map(x=>`<button class="chart-btn ${x==='SPY'?'active':''}" data-asset="${x}">${x}</button>`).join('')}</div><div class="chart-legend"><span class="legend-key" style="color:#e7d3a0"><i class="legend-swatch"></i>Kompozit skor</span><span class="legend-key" style="color:#5aa9ff"><i class="legend-swatch"></i>Seçili varlık (normalize)</span></div><canvas id="scoreHistoryChart"></canvas><div class="chart-note">${d.backtest_note||''}</div></div>`}
if(d.macro_market_history){h+=`<div class="card chart-card"><h2>Core PCE · Fed Faizi · S&P 500 ${tip('Enflasyon, para politikası ve hisse piyasasının yaklaşık son 5 yıldaki birlikte hareketini gösterir.')}</h2><div class="chart-legend"><span class="legend-key" style="color:#5aa9ff"><i class="legend-swatch"></i>Core PCE YoY</span><span class="legend-key" style="color:#39ff88"><i class="legend-swatch"></i>Fed Faizi</span><span class="legend-key" style="color:#d7b96f"><i class="legend-swatch"></i>S&P 500</span></div><canvas id="macroHistoryChart"></canvas><div class="chart-note">Sol eksen yüzde, sağ eksen S&P 500 seviyesi. Korelasyon görselleştirmesidir; tek başına nedensellik değildir.</div></div>`}
if(d.credit_history){h+=`<div class="card chart-card"><h2>HY · IG · CCC Kredi Spread Geçmişi ${tip('Spreadlerin birlikte veya birbirinden ayrışarak hareket etmesi kredi stresinin geniş tabanlı mı yoksa düşük kaliteli borçta mı yoğunlaştığını gösterir.')}</h2><div class="chart-legend"><span class="legend-key" style="color:${G}"><i class="legend-swatch"></i>HY</span><span class="legend-key" style="color:#5aa9ff"><i class="legend-swatch"></i>IG</span><span class="legend-key" style="color:#ff8b5c"><i class="legend-swatch"></i>CCC</span></div><canvas id="creditHistoryChart"></canvas></div>`}
h+=`<div class="stat-grid" style="margin-bottom:20px">${d.credit_cycle?.phase?`<div class="card"><h2>Kredi Döngüsü</h2><div class="badge">${d.credit_cycle.emoji} ${d.credit_cycle.phase}</div><div class="desc">${d.credit_cycle.desc||''}</div></div>`:''}${d.yield_curve?.regime?`<div class="card"><h2>Yield Curve</h2><div class="badge">${d.yield_curve.emoji} ${d.yield_curve.regime} (${d.yield_curve.spread>=0?'+':''}${d.yield_curve.spread.toFixed(2)})</div><div class="desc">${d.yield_curve.desc||''}</div></div>`:''}</div>`;
if(d.early_warnings?.length)h+=`<div class="card"><h2>Erken Uyarı Sinyalleri</h2><div class="table-wrap"><table class="warnings"><tr><th>Sinyal</th><th>Değer</th><th>Uyarı</th><th>Kriz</th><th>Durum</th></tr>${d.early_warnings.map(w=>`<tr><td>${w.name}</td><td>${w.value}</td><td>${w.warn}</td><td>${w.crisis}</td><td>${w.status}</td></tr>`).join('')}</table></div></div>`;
content.innerHTML=h+src();requestAnimationFrame(()=>{drawScoreChart();drawMacroChart(d.macro_market_history);drawCreditChart(d.credit_history);document.querySelectorAll('.chart-btn').forEach(b=>b.onclick=()=>{ACTIVE_ASSET=b.dataset.asset;document.querySelectorAll('.chart-btn').forEach(x=>x.classList.toggle('active',x===b));drawScoreChart()})});window.addEventListener('resize',()=>{drawScoreChart();drawMacroChart(d.macro_market_history);drawCreditChart(d.credit_history)},{passive:true})}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src()}}load();
</script></body></html>
