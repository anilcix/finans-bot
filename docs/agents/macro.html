<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makro — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>🌡️ MAKRO</h1><p>Kompozit Skor · Kredi Döngüsü · Yield Curve · Erken Uyarılar</p></div><div class="container" id="content"></div><script>const G='#39ff88',A='#ffcf5c',R='#ff5c5c';function color(s){return s>=60?G:s>=40?A:R}function stat(s){if(!s)return A;if(s.includes('🔴'))return R;if(s.includes('🟠'))return A;return G}async function load(){try{let d=await(await fetch('../data/macro.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');if(d.error)throw Error(d.error);let h='';if(d.composite_score!=null)h+=`<div class="card"><h2>Kompozit Piyasa Isı Skoru</h2><div class="big-score"><div class="num" style="color:${color(d.composite_score)}">${Math.round(d.composite_score)}<span style="font-size:20px;color:var(--muted)">/100</span></div><div class="label">${d.composite_emoji||''} ${d.composite_label||''}</div></div></div>`;if(d.barometer?.length){h+=`<div class="card"><h2>Piyasa Barometresi</h2><div class="sub">Tarihsel percentile</div>`;d.barometer.forEach(m=>{let sc=m.invert?100-m.percentile:m.percentile;h+=`<div class="gauge-row"><div class="meta"><span>${m.label}</span><span class="val">${m.value.toFixed(2)} · %${m.percentile.toFixed(0)}</span></div><div class="gauge-track"><div class="gauge-fill" style="width:${m.percentile}%;background:${color(sc)}"></div></div></div>`});h+='</div>'}h+=`<div class="stat-grid" style="margin-bottom:20px">${d.credit_cycle?.phase?`<div class="card"><h2>Kredi Döngüsü</h2><div class="badge">${d.credit_cycle.emoji} ${d.credit_cycle.phase}</div><div class="desc">${d.credit_cycle.desc||''}</div></div>`:''}${d.yield_curve?.regime?`<div class="card"><h2>Yield Curve</h2><div class="badge">${d.yield_curve.emoji} ${d.yield_curve.regime} (${d.yield_curve.spread>=0?'+':''}${d.yield_curve.spread.toFixed(2)})</div><div class="desc">${d.yield_curve.desc||''}</div></div>`:''}</div>`;if(d.early_warnings?.length)h+=`<div class="card"><h2>Erken Uyarı Sinyalleri</h2><div class="table-wrap"><table class="warnings"><tr><th>Sinyal</th><th>Değer</th><th>Uyarı</th><th>Kriz</th><th>Durum</th></tr>${d.early_warnings.map(w=>`<tr><td>${w.name}</td><td>${w.value}</td><td>${w.warn}</td><td>${w.crisis}</td><td style="color:${stat(w.status)}">${w.status}</td></tr>`).join('')}</table></div></div>`;content.innerHTML=h||'<div class="empty">Veri yok.</div>'}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`}}load()</script></body></html>
