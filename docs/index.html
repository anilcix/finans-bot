<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piyasa İstihbarat Ağı</title><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap');:root{--bg:#050806;--g:#39ff88;--gd:#175c3a;--t:#d7ffe6;--m:#5c8a72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:'IBM Plex Mono',monospace;min-height:100vh;overflow-x:hidden}canvas{position:fixed;inset:0;opacity:.1;pointer-events:none}header{text-align:center;padding:50px 20px 8px;position:relative;z-index:2}h1{font-family:'Space Grotesk',sans-serif;color:var(--g);letter-spacing:3px;font-size:clamp(24px,5vw,42px);margin:0;text-shadow:0 0 26px rgba(57,255,136,.45)}header p{color:var(--m);font-size:12px;letter-spacing:2px}.status{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--gd);border-radius:99px;padding:7px 14px;color:var(--m);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g)}.network{position:relative;width:min(92vw,720px);height:min(92vw,720px);margin:35px auto 15px;z-index:2}.links{position:absolute;inset:0;width:100%;height:100%}.hub,.node{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.hub{top:50%;left:50%;transform:translate(-50%,-50%);width:132px;height:132px;border:1px solid var(--g);background:#061109;box-shadow:0 0 45px rgba(57,255,136,.35);z-index:3}.hub b{font:700 12px 'Space Grotesk'}.hub span{font-size:9px;color:var(--m);margin-top:5px}.node{width:104px;height:104px;transform:translate(-50%,-50%);border:1px solid var(--gd);background:#071008;color:var(--t);text-decoration:none;padding:8px;z-index:2;transition:.2s}.node:hover{border-color:var(--g);box-shadow:0 0 22px rgba(57,255,136,.4);transform:translate(-50%,-50%) scale(1.08)}.node b{font:600 10px 'Space Grotesk';margin-top:5px}.legend{max-width:720px;margin:0 auto 45px;padding:0 20px;text-align:center;color:var(--m);font-size:11px;line-height:1.7;position:relative;z-index:2}footer{text-align:center;border-top:1px solid var(--gd);padding:22px;color:var(--m);font-size:11px;position:relative;z-index:2}footer a{color:var(--g)}</style></head><body><canvas id="rain"></canvas><header><h1>PİYASA İSTİHBARAT AĞI</h1><p>9 AJAN · GERÇEK VERİ · GITHUB ACTIONS</p><div class="status"><span class="dot"></span> Her 6 saatte otomatik veri güncellemesi</div></header><div class="network" id="network"><svg class="links" id="links"></svg><div class="hub"><div style="font-size:22px">🧠</div><b>HARMANLAYICI</b><span>yorum katmanı<br>sonraki aşama</span></div></div><p class="legend">Her ajan kendi veri kümesini toplar. Bir ajana tıklayarak detay panelini açabilirsin.</p><footer><a href="https://github.com/anilcix/finans-bot" target="_blank">GitHub reposu</a></footer><script>const agents=[['🌡️','MAKRO','macro'],['💳','KREDİ','credit'],['₿','KRİPTO','crypto'],['📐','KRİPTO TÜREV','crypto_derivatives'],['📊','OPSİYON','options'],['📈','HİSSE / EMTİA','equities'],['🕵️','GİZLİ BASKI','hidden_pressure'],['🔍','TARAYICI','screener'],['📰','HABERLER','news']];const n=document.getElementById('network'),svg=document.getElementById('links');function layout(){svg.innerHTML='';n.querySelectorAll('.node').forEach(x=>x.remove());const z=n.offsetWidth,c=z/2,r=z*.375;svg.setAttribute('viewBox',`0 0 ${z} ${z}`);agents.forEach((a,i)=>{const q=i/agents.length*2*Math.PI-Math.PI/2,x=c+r*Math.cos(q),y=c+r*Math.sin(q);let l=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:c,y1:c,x2:x,y2:y,stroke:'rgba(57,255,136,.18)'}).forEach(([k,v])=>l.setAttribute(k,v));svg.appendChild(l);let e=document.createElement('a');e.className='node';e.href=`./agents/${a[2]}.html`;e.style.left=x+'px';e.style.top=y+'px';e.innerHTML=`<div style="font-size:20px">${a[0]}</div><b>${a[1]}</b>`;n.appendChild(e)})}layout();addEventListener('resize',layout);const cv=document.getElementById('rain'),ctx=cv.getContext('2d');let drops=[];function rs(){cv.width=innerWidth;cv.height=innerHeight;drops=Array(Math.floor(cv.width/15)).fill(1)}rs();addEventListener('resize',rs);setInterval(()=>{ctx.fillStyle='rgba(5,8,6,.08)';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#39ff88';ctx.font='15px monospace';drops.forEach((y,i)=>{ctx.fillText('01$%+-'[Math.floor(Math.random()*6)],i*15,y*15);if(y*15>cv.height&&Math.random()>.975)drops[i]=0;drops[i]++})},70)</script></body></html>
