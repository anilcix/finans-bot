<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piyasa İstihbarat Ağı</title><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap');:root{--bg:#050806;--g:#39ff88;--gd:#175c3a;--t:#d7ffe6;--m:#5c8a72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:'IBM Plex Mono',monospace;min-height:100vh;overflow-x:hidden}canvas{position:fixed;inset:0;opacity:.1;pointer-events:none}header{text-align:center;padding:50px 20px 8px;position:relative;z-index:2}h1{font-family:'Space Grotesk',sans-serif;color:var(--g);letter-spacing:3px;font-size:clamp(24px,5vw,42px);margin:0;text-shadow:0 0 26px rgba(57,255,136,.45)}header p{color:var(--m);font-size:12px;letter-spacing:2px}.status{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--gd);border-radius:99px;padding:7px 14px;color:var(--m);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);animation:blink 2s ease-in-out infinite}@keyframes blink{50%{opacity:.3}}.network{position:relative;width:min(96vw,860px);height:min(96vw,860px);margin:32px auto 18px;z-index:2}.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.link-line{stroke:rgba(57,255,136,.22);stroke-width:1.25;stroke-dasharray:8 12;animation:dashflow 13s linear infinite}@keyframes dashflow{to{stroke-dashoffset:-80}}.hub,.node{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.hub{top:50%;left:50%;transform:translate(-50%,-50%);width:148px;height:148px;border:1px solid var(--g);background:radial-gradient(circle at 32% 30%,#0d3322,#020a05 72%);box-shadow:0 0 45px rgba(57,255,136,.35),inset 0 0 22px rgba(57,255,136,.12);z-index:3;animation:pulse 3.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 64px rgba(57,255,136,.55),inset 0 0 28px rgba(57,255,136,.2)}}.hub b{font:700 13px 'Space Grotesk'}.hub span{font-size:9.5px;color:var(--m);margin-top:5px}.node{width:122px;height:122px;transform:translate(-50%,-50%);border:1px solid var(--gd);background:#071008;color:var(--t);text-decoration:none;padding:8px;z-index:2;transition:.2s}.node:hover{border-color:var(--g);box-shadow:0 0 24px rgba(57,255,136,.45);transform:translate(-50%,-50%) scale(1.08)}.node b{font:600 10.5px 'Space Grotesk';margin-top:6px;max-width:86px;line-height:1.25}.pulse-dot{fill:var(--g);filter:drop-shadow(0 0 4px var(--g))}.legend{max-width:760px;margin:0 auto 48px;padding:0 20px;text-align:center;color:var(--m);font-size:11px;line-height:1.8;position:relative;z-index:2}footer{text-align:center;border-top:1px solid var(--gd);padding:22px;color:var(--m);font-size:11px;position:relative;z-index:2}footer a{color:var(--g)}@media(max-width:640px){.network{width:min(98vw,700px);height:min(98vw,700px)}.node{width:102px;height:102px}.hub{width:132px;height:132px}.node b{font-size:9.5px}}@media(prefers-reduced-motion:reduce){.hub,.dot,.link-line{animation:none}.pulse-dot{display:none}}</style></head><body><canvas id="rain"></canvas><header><h1>PİYASA İSTİHBARAT AĞI</h1><p>9 AJAN · GERÇEK VERİ · GITHUB ACTIONS</p><div class="status"><span class="dot"></span> Her 6 saatte otomatik veri güncellemesi</div></header><div class="network" id="network"><svg class="links" id="links"></svg><div class="hub"><div style="font-size:24px">🧠</div><b>HARMANLAYICI</b><span>tüm ajanları<br>özetler</span></div></div><p class="legend">Her ajan kendi veri kümesini toplar. Akan çizgiler veri akışını temsil eder; daireye tıklayarak ilgili ajan panelini açabilirsin.</p><footer><a href="https://github.com/anilcix/finans-bot" target="_blank">GitHub reposu</a></footer><script>const agents=[['🌡️','MAKRO','macro'],['💳','KREDİ','credit'],['₿','KRİPTO','crypto'],['📐','KRİPTO TÜREV','crypto_derivatives'],['📊','OPSİYON','options'],['📈','HİSSE / EMTİA','equities'],['🕵️','GİZLİ BASKI','hidden_pressure'],['🔍','TARAYICI','screener'],['📰','HABERLER','news']];const n=document.getElementById('network'),svg=document.getElementById('links');function layout(){svg.innerHTML='';n.querySelectorAll('.node').forEach(x=>x.remove());const z=n.offsetWidth,c=z/2,r=z*.43;svg.setAttribute('viewBox',`0 0 ${z} ${z}`);agents.forEach((a,i)=>{const q=i/agents.length*2*Math.PI-Math.PI/2,x=c+r*Math.cos(q),y=c+r*Math.sin(q);let l=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:c,y1:c,x2:x,y2:y,class:'link-line'}).forEach(([k,v])=>l.setAttribute(k,v));l.style.animationDuration=(10+(i%4)*1.8)+'s';svg.appendChild(l);let p=document.createElementNS('http://www.w3.org/2000/svg','circle');p.setAttribute('r','3.2');p.setAttribute('class','pulse-dot');let m=document.createElementNS('http://www.w3.org/2000/svg','animateMotion');m.setAttribute('dur',(3.2+(i%3)*.8)+'s');m.setAttribute('repeatCount','indefinite');m.setAttribute('path',`M${c},${c} L${x},${y} L${c},${c}`);p.appendChild(m);svg.appendChild(p);let e=document.createElement('a');e.className='node';e.href=`./agents/${a[2]}.html`;e.style.left=x+'px';e.style.top=y+'px';e.innerHTML=`<div style="font-size:22px">${a[0]}</div><b>${a[1]}</b>`;n.appendChild(e)})}layout();addEventListener('resize',layout);const cv=document.getElementById('rain'),ctx=cv.getContext('2d');let drops=[];function rs(){cv.width=innerWidth;cv.height=innerHeight;drops=Array(Math.floor(cv.width/15)).fill(1)}rs();addEventListener('resize',rs);setInterval(()=>{ctx.fillStyle='rgba(5,8,6,.08)';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#39ff88';ctx.font='15px monospace';drops.forEach((y,i)=>{ctx.fillText('01$%+-'[Math.floor(Math.random()*6)],i*15,y*15);if(y*15>cv.height&&Math.random()>.975)drops[i]=0;drops[i]++})},70)</script></body></html>
